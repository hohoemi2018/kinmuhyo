/* ---------- 管理者の暗証番号 ---------- */
function hashPin(p){let h=5381;const t='hohoemi:'+p;for(let i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))|0;}return 'h'+(h>>>0).toString(36);}
/* 予備のコード・解除コード用の、もう少し長いハッシュ */
function hash53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
const hashRc=c=>'r'+hash53('hohoemi-rc:'+c).toString(36);
/* ほほえみカレッジが出す解除コード（問い合わせ番号ごとにちがう6けた） */
const UNLOCK_KEY='hc-2026-sakura-hiyoko';
const unlockOf=q=>String(hash53('hohoemi-unlock:'+UNLOCK_KEY+':'+q)%1000000).padStart(6,'0');
function rand(n){let out='';const a=new Uint32Array(n);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*4294967296);}for(let i=0;i<n;i++) out+=String(a[i]%10);return out;}
const fmtRc=c=>c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8,12);
function newRc(){const c=rand(12);S.rc=hashRc(c);S.rcAt=Date.now();save();return c;}

      +'<p class="hint">合同会社発達支援ほほえみカレッジに、次の「問い合わせ番号」をお伝えください。お返事の「解除コード」（6けた）を入れると、暗証番号を決め直せます。</p>'

      +(m==='enter'?'<div class="row"><button type="button" class="btn quiet" data-act="pinforgot">暗証番号を忘れたとき</button></div>':'');
  }
  $('#pin-form').innerHTML=h;

/* 予備のコードを見せる。控えたら next（staff:職員用の画面へ／admin:管理者の画面へ）に進む */
function showRc(code,note,next){UI.rcCode=code;UI.rcNote=note||'';UI.pinNext=next||null;UI.pin='rcshow';UI.pinErr='';drawPin();$('#pin').hidden=false;pinFocus();}

/* 全角の数字で入っても受けつける */
const half=v=>String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s+/g,'');
const digitsOf=v=>half(v).replace(/[^0-9]/g,'');
/* まちがいが続いたら、少し待ってもらう */
let pinFails=0,pinWaitUntil=0;
function pinWaiting(){if(Date.now()<pinWaitUntil){UI.pinErr='入力のまちがいが続いたので、'+Math.ceil((pinWaitUntil-Date.now())/1000)+'秒ほど待ってから入れてください';drawPin();pinFocus();return true;}return false;}
function pinFail(msg){pinFails++;if(pinFails>=5){pinFails=0;pinWaitUntil=Date.now()+30000;}UI.pinErr=msg;drawPin();pinFocus();}
function pinSubmit(){
  if(UI.pin==='forgot'||UI.pin==='rcshow') return;
  const a=half(($('#pin-a')||{}).value);
  if(UI.pin==='set'||UI.pin==='reset'){
    const b2=half(($('#pin-b')||{}).value);
    if(!/^\d{4,8}$/.test(a)){UI.pinErr='4〜8けたの数字で入れてください';drawPin();$('#pin-a').focus();return;}
    if(a!==b2){UI.pinErr='2回の入力がちがっています。もう一度入れてください';drawPin();$('#pin-a').focus();return;}
    S.pin=hashPin(a);const next=UI.pinNext;
    if(UI.pin==='reset'){S.pinReq=null;const c=newRc();showRc(c,'新しい暗証番号にしました。前の予備のコードは使えなくなったので、新しいコードを控えてください。','admin');return;}
    if(!S.rc){const c=newRc();showRc(c,'',next==='staff'?'staff':'pinset');return;}
    closePin();
    if(next==='staff') toStaffMode('暗証番号を決めて、職員用の画面にしました');
    else{save();renderMain();toast('暗証番号を変えました（予備のコードはそのままです）');}
    return;
  }
  if(pinWaiting()) return;
  if(S.pin&&hashPin(a)===S.pin){
    pinFails=0;closePin();S.mode='admin';UI.me=null;save();render();window.scrollTo(0,0);
    if(!S.rc){const c=newRc();showRc(c,'暗証番号を忘れたときのために、予備のコードを作りました。','login');return;}
    toast('管理者の画面にもどりました');
  }
  else pinFail('暗証番号がちがいます');
}
function rcUse(){
  if(pinWaiting()) return;
  const c=digitsOf(($('#rc-in')||{}).value);
  if(c.length!==12){UI.pinErr='予備のコードは12けたの数字です（ハイフンはあってもなくてもかまいません）';drawPin();pinFocus();return;}
  if(!S.rc||hashRc(c)!==S.rc){pinFail('予備のコードがちがいます。いちばん新しく控えたコードか、確かめてください');return;}
  pinFails=0;pinGo('reset');
}
function ulUnlock(){
  if(pinWaiting()) return;
  const c=digitsOf(($('#ul-in')||{}).value);
  if(c.length!==6){UI.pinErr='解除コードは6けたの数字です';drawPin();$('#ul-in').focus();return;}
  if(!S.pinReq||unlockOf(S.pinReq.code)!==c){pinFail('解除コードがちがいます。問い合わせ番号と合っているか、確かめてください');return;}
  pinFails=0;pinGo('reset');
}

function rosterMatrix(){
  const ck=check(S);const info=ck.info;const sc=S.schedules[S.ym];const MS=monthSh(sc,true);
  const rows=[['なまえ'].concat(info.days.map(d=>d.d+'('+DOW[d.dow]+')'),MS.map(t=>SHN[t]),['勤務日数','休み'])];
  S.staff.forEach(s=>{
    const c=sc.cells[s.id]||{};const w=wishOf(S,s.id);const p=ck.per[s.id];
    rows.push([s.name||'名前なし'].concat(info.days.map(day=>{const t=c[day.d];if(t){const hk=ownHrs(s)&&(s.hrs.alt||[]).length?bandOf(S,s,day.d,sc.hb):0;return SHS[t]+(hk>0?'('+(hk+1)+')':'')+(w[day.d]==='H'?'(半有)':'');}return !day.open?'':w[day.d]==='W'?'希':w[day.d]==='P'?'有':w[day.d]==='H'?'半有':'休';}),MS.map(t=>p[t]||0),[p.work,info.n-p.work]));
  });
  MS.forEach(t=>{rows.push([SHN[t]+'の人数'].concat(info.days.map(day=>day.open?(ck.dayCnt[day.d][t]||0):'')));});
  [{id:null,name:'全員'}].concat(qShown()).forEach(q=>{HALVES.forEach(h=>{rows.push([q.name+'の人数（'+HALFN[h]+'）'].concat(info.days.map(day=>day.open?qCount(S,sc.cells,day.d,q.id,h,sc.hb):'')));});});
  return rows;
}

function loadLibs(){

  if(!libP) libP=Promise.all(LIBS.map(src=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc);}))).catch(e=>{libP=null;throw e;});

}

function busy(msg){const b=$('#busy');if(msg==null){b.hidden=true;return;}$('#busy-msg').textContent=msg;if(b.hidden){$('#busy-art').innerHTML=chick();b.hidden=false;}}
async function makePdf(kind,printIt){
  if(BUSY) return;BUSY=true;
  let win=null;
  if(printIt){try{win=window.open('','_blank');}catch(e){win=null;}}
  busy('PDFの準備をしています…');
  const stage=$('#pdf-stage');
  try{
    await loadLibs();
    const pages=pdfPages(kind);if(!pages.length) throw new Error('empty');
    const orient=(kind==='personal'||kind==='tcone'||kind==='tcall')?'portrait':'landscape';
    const PW=orient==='portrait'?210:297,PH=orient==='portrait'?297:210,M=8;
    const pdf=new window.jspdf.jsPDF({orientation:orient,unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      busy('PDFを作っています（'+(i+1)+' / '+pages.length+'ページ）');
      stage.innerHTML=pages[i];
      if(document.fonts&&document.fonts.ready) await document.fonts.ready;
      /* 絵は画像に置きかえてから写す（PDFの中でずれずに描ける） */
      const imgs=[];
      stage.querySelectorAll('svg').forEach(v=>{
        const r=v.getBoundingClientRect();const c=v.cloneNode(true);
        c.setAttribute('width',r.width.toFixed(2));c.setAttribute('height',r.height.toFixed(2));
        const img=new Image();img.alt='';img.className=v.getAttribute('class')||'';
        img.style.cssText='width:'+r.width.toFixed(2)+'px;height:'+r.height.toFixed(2)+'px;display:'+getComputedStyle(v).display+';flex:none';
        img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c));
        v.replaceWith(img);imgs.push(img);
      });
      await Promise.all(imgs.map(m=>m.decode?m.decode().catch(()=>{}):Promise.resolve()));
      const canvas=await window.html2canvas(stage.firstElementChild,{scale:2,backgroundColor:'#FFFDF9',logging:false,windowWidth:1400,windowHeight:1000,
        onclone:d=>{d.documentElement.setAttribute('data-theme','light');}});
      const ratio=canvas.height/canvas.width;let w=PW-2*M,h=w*ratio;if(h>PH-2*M){h=PH-2*M;w=h/ratio;}
      if(i>0) pdf.addPage('a4',orient);
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',(PW-w)/2,M,w,h,undefined,'FAST');
    }
    stage.innerHTML='';
    pdf.setProperties({title:pdfName(kind).replace(/\.pdf$/,'')});
    if(printIt){
      pdf.autoPrint();const url=pdf.output('bloburl');
      if(win) win.location.href=url;else{busy(null);await saveFile(pdfName(kind),pdf.output('blob'),'application/pdf');}
    }else{
      busy(null);await saveFile(pdfName(kind),pdf.output('blob'),'application/pdf');
    }
  }catch(e){
    stage.innerHTML='';if(win){try{win.close();}catch(_){}}
    toast(e&&e.message==='load'?'PDFの部品を読み込めませんでした。インターネットにつながった状態で、もう一度お試しください':'PDFを作れませんでした。もう一度お試しください');
  }finally{BUSY=false;busy(null);}
}
async function saveFile(filename,data,mime){
  if(DL){
    try{await DL.save({filename:filename,data:data});toast('保存しました');}
    catch(e){const code=e&&e.code;if(code==='declined') return;toast(code==='rate_limited'?'少し待ってから、もう一度お試しください':'この画面では保存できませんでした');}
    return;
  }
  if(TOP){
    try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
    catch(e){toast('保存できませんでした');}
  }
}
function copyText(text,okMsg){
  const manual=()=>{const ta=$('#modal-ta');ta.value=text;$('#modal').hidden=false;ta.focus();ta.select();};
  const second=()=>{
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    ta.remove();if(ok) toast(okMsg);else manual();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(okMsg),second);
  else second();
}
let toastTimer=0;

    const s=staffById(b.dataset.s);const k=Number(v);if(!s||!s.hrs||!s.hrs.alt||!s.hrs.alt[k]) return;
    s.hrs.alt.splice(k,1);
    /* 日ごとに選んでいた時間の番号を、ひとつずつずらす */
    Object.keys(S.schedules).forEach(ym=>{const sc=S.schedules[ym];const o=sc&&sc.hb&&sc.hb[s.id];if(!o) return;Object.keys(o).forEach(d=>{const x=Number(o[d]);if(x===k+1) delete o[d];else if(x>k+1) o[d]=x-1;});});
    touch();renderMain();toast('時間'+(k+2)+'を消しました');
    const el=$('#sh-'+s.id+'-on');if(el) el.focus({preventScroll:true});
  },
  selp(v){UI.selP=v;UI.all=false;renderMain();},
  allp(){UI.all=!UI.all;renderMain();},
  copyp(){
    const list=UI.all?S.staff:[staffById(UI.selP)];
    copyText(list.map(personalText).join('\n\n――――――――\n\n'),'コピーしました');
  },
  copytsv(){copyText(rosterMatrix().map(r=>r.join('\t')).join('\n'),'コピーしました。Excelに貼り付けてください');},
  savecsv(){
    const csv=toCSV(rosterMatrix());
    saveFile('kinmuhyo-'+S.ym+'.csv',csv,'text/csv;charset=utf-8');
  },
  pdf(v){makePdf(v,false);},
  punch(v){doPunch(v);},
  brkpick(v){brkPick(v);},
  rqopen(v){const me=staffById(UI.me);if(!me) return;const day=v||todayKey();const r=(S.punches[day]||{})[me.id];
    UI.rq={day:day,reason:r&&r.i!=null&&r.o==null?'退勤を押し忘れ':r&&r.i==null&&r.o!=null?'出勤を押し忘れ':'',note:'',err:''};renderMain();const f=$('#rq-sec');if(f) f.scrollIntoView({block:'start'});},
  rqreason(v){if(!UI.rq) return;UI.rq.reason=v;document.querySelectorAll('[data-act="rqreason"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));},
  rqsend(){rqSubmit();},
  rqclose(){UI.rq=null;renderMain();},
  rqcancel(v){const q=(S.reqs||[]).find(x=>x.id===v);if(!q||q.sid!==UI.me||q.st!=='wait') return;S.reqs=S.reqs.filter(x=>x.id!==v);save();renderMain();toast('申請を取り下げました');},
  rqok(v){
    const q=(S.reqs||[]).find(x=>x.id===v);if(!q||q.st!=='wait') return;
    const day=S.punches[q.day]||(S.punches[q.day]={});const r=day[q.sid]||(day[q.sid]={i:null,o:null});
    if(q.i!=null) r.i=q.i;if(q.o!=null) r.o=q.o;if(q.b!=null) r.b=q.b;
    if(r.i!=null&&r.o!=null&&r.o<=r.i) r.o+=1440;
    r.a=1;q.st='ok';q.doneAt=Date.now();S.punchAt=Date.now();UI.tcsel=q.sid;UI.tcym=q.day.slice(0,7);save();renderSteps();renderMain();toast('承認して、記録を直しました（下の「個人の記録」に表示しています）');
  },
  rqng(v){const q=(S.reqs||[]).find(x=>x.id===v);if(!q||q.st!=='wait') return;q.st='ng';q.doneAt=Date.now();save();renderSteps();renderMain();toast('見送りました。職員の画面に「見送り」と表示されます');},
  tcback(){UI.punched=null;renderMain();},
  tcmonth(v){const p=(UI.tcym||curYm()).split('-').map(Number);const dt=new Date(p[0],p[1]-1+Number(v),1);UI.tcym=dt.getFullYear()+'-'+pad(dt.getMonth()+1);renderMain();},
  tcsel(v){UI.tcsel=v;renderMain();const d=$('#tc-detail');if(d) d.scrollIntoView({block:'start'});},
  tcsum(){
    const ym=UI.tcym||curYm();const rows=S.staff.map(s=>{const p=tcPerson(s.id,ym);return {sid:s.id,name:s.name,days:p.days,min:p.min,miss:p.miss,paid:p.paid,pd:p.pd};});
    const total={days:0,min:0,miss:0,paid:0};rows.forEach(r=>{total.days+=r.days;total.min+=r.min;total.miss+=r.miss;total.paid+=r.paid;});
    S.tcSnap[ym]={at:Date.now(),rows:rows,total:total};save();renderMain();toast('全員の勤務時間を集計しました');
  },
  tccopy(){copyText(tcSummaryRows(UI.tcym||curYm()).map(r=>r.join('\t')).join('\n'),'コピーしました。Excelに貼り付けてください');},
  tccsv(){const ym=UI.tcym||curYm();saveFile('timecard-'+ym+'.csv',toCSV(tcDetailRows(ym)),'text/csv;charset=utf-8');},
  pdfprint(v){makePdf(v,true);},
  zmode(v){UI.zmode=v;S.zmode=v;save();renderMain();},
  bkcopy(){copyText(JSON.stringify(S),'控えをコピーしました。メモ帳などに貼り付けて保管してください');},
  bkrestore(){
    let s=null;try{const o=JSON.parse($('#bk-ta').value);if(o&&!o.punches){o.punches={};o.reqs=o.reqs||[];o.paid=o.paid||{};}s=normalize(o);}catch(e){s=null;}
    if(!s){toast('控えを読み取れませんでした。コピーした文字をそのまま貼り付けてください');return;}
    S=s;UI.view=S.view||'joken';UI.selW=UI.selP=null;save();render();toast('控えから戻しました');
  },
  closemodal(){$('#modal').hidden=true;},
  async licadd(){
    const ta=$('#lic-in');const r=await licAddText(ta?ta.value:'');
    if(!r.ok){toast(r.msg);return;}
    if(!r.mine){toast('登録しました。この利用リンクで使えるのは「'+(r.o.a||[]).map(c=>APP_LABEL[c]).join('」「')+'」です');return;}
    render();window.scrollTo(0,0);toast(r.o.n+' 様として登録しました');
  },
  impgo(){UI.view='joken';UI.imp=null;render();impScroll();},
  impdev(){const R=readOld('roster'),T=readOld('tc');if(!R&&!T){toast('この端末には、取りこめるデータがありません');return;}UI.imp={R:R,T:T};UI.impMsg='';renderMain();impScroll();},
  imppaste(){
    const tr=($('#imp-r')||{}).value||'',tt=($('#imp-t')||{}).value||'';
    if(!tr.trim()&&!tt.trim()){toast('控えを貼り付けてください');return;}
    const R=tr.trim()?parseOld(tr):null,T=tt.trim()?parseOld(tt):null;
    if(tr.trim()&&!R){toast('勤務表の控えを読み取れませんでした。コピーした文字をそのまま貼り付けてください');return;}
    if(tt.trim()&&!T){toast('タイムカードの控えを読み取れませんでした。コピーした文字をそのまま貼り付けてください');return;}
    UI.imp={R:R,T:T};UI.impMsg='';renderMain();impScroll();
  },
  impno(){UI.imp=null;renderMain();impScroll();},
  impyes(){
    const q=UI.imp;if(!q) return;const res=mergeOld(q.R,q.T);
    if(!res.state){toast('取りこめませんでした。もう一度お試しください');return;}
    S=res.state;save();UI.imp=null;UI.view='joken';UI.selW=UI.selP=null;UI.tcsel=null;UI.tcym=null;const r=res.rep;
    UI.impMsg='取りこみました。職員 '+r.staff+'人'+(q.R&&q.T?'（同じ名前で1人にまとめた人 '+r.same+'人'+(r.added?'、タイムカードだけにいた人 '+r.added+'人':'')+'）':'')+'。'
      +(r.pin==='roster'?'暗証番号は、勤務表のアプリで決めた番号を使います。':r.pin==='tc'?'暗証番号は、タイムカードのアプリで決めた番号を使います。':'')
      +'②職員で、資格や勤務できる曜日などを確かめてください。';
    render();impScroll();toast('取りこみました');
  }
};
const CHG={
  shset(el){
    const t=el.dataset.t;const x=S.shifts[t];if(!x) return;
    if(el.dataset.k==='name'){
      const v=Array.from(el.value.trim()).slice(0,8).join('');if(!v){el.value=x.name;toast('勤務の名前を入れてください');return;}
      x.name=v;el.value=v;if(SH.some(k=>k!==t&&S.shifts[k].name===v)) toast('同じ名前の勤務があります。見分けやすい名前にしてください');
    }else{const v=Array.from(el.value.replace(/[\s　]/g,'')).slice(0,2).join('');if(v){x.ab=v;x.abAuto=false;}else x.abAuto=true;}
    syncAbs(S);syncSH();touch();shRefresh();const a=$('#sh-'+t+'-ab');if(a) a.value=SHS[t];
  },
  qset(el){const q=qById(el.dataset.q);if(!q) return;q[el.dataset.k]=clampInt(el.value,0,30);el.value=q[el.dataset.k];touch();},
  rqday(el){if(!UI.rq) return;UI.rq.day=el.value;UI.rq.iv=null;UI.rq.ov=null;UI.rq.bv=null;UI.rq.err='';renderMain();const d=$('#rq-day');if(d) d.focus();},
  tcset(el){S.tc[el.dataset.k]=clampInt(el.value,el.min,el.max);el.value=S.tc[el.dataset.k];S.punchAt=Date.now();save();renderMain();},
  tcedit(el){
    const k=el.dataset.day,sid=el.dataset.sid;const day=S.punches[k]||(S.punches[k]={});const r=day[sid]||(day[sid]={i:null,o:null});
    r[el.dataset.k]=toMin(el.value);
    if(r.i!=null&&r.o!=null){r.o=r.o%1440;if(r.o<=r.i) r.o+=1440;}
    if(r.i==null&&r.o==null) delete day[sid];else r.e=1;
    if(!Object.keys(day).length) delete S.punches[k];
    S.punchAt=Date.now();save();tcDetailRefresh(k,sid);
  },
  tcbrk(el){
    const k=el.dataset.day,sid=el.dataset.sid;const r=(S.punches[k]||{})[sid];if(!r) return;
    if(el.value==='') delete r.b;else r.b=Number(el.value);r.e=1;
    S.punchAt=Date.now();save();tcDetailRefresh(k,sid,'b');
  },
  tcpaid(el){
    const k=el.dataset.day,sid=el.dataset.sid;
    if(el.value===''){if(S.paid[k]){delete S.paid[k][sid];if(!Object.keys(S.paid[k]).length) delete S.paid[k];}}
    else (S.paid[k]=S.paid[k]||{})[sid]=Number(el.value);
    el.classList.toggle('on',el.value!=='');S.punchAt=Date.now();save();tcDetailRefresh(k,sid);
  },
  opendow(el){
    const d=Number(el.dataset.v);const i=S.openDows.indexOf(d);
    if(el.checked&&i<0) S.openDows.push(d);if(!el.checked&&i>=0) S.openDows.splice(i,1);
    touch();renderTop();$('#jcal').innerHTML=jokenCal(INFO());
  },
  sf(el){
    const s=staffById(el.dataset.sid);if(!s) return;const k=el.dataset.k;
    if(k==='name'){s.name=el.value.trim();save();return;}
    if(k==='brk'){s.brk=el.value===''?null:Number(el.value);S.punchAt=Date.now();save();return;}
    if(k==='type'){s.type=el.value;touch();renderMain();return;}
    if(k==='can') s.can[el.dataset.v]=el.checked;
    else if(k==='bst'||k==='ben'){const b=((s.hrs||{}).alt||[])[Number(el.dataset.b)];if(!b) return;if(el.value){if(k==='bst') b.start=el.value;else b.end=el.value;}touch();const hn=$('#hn-'+s.id);if(hn) hn.textContent=hrsNote(s);return;}
    else if(k==='bdow'){
      const kk=Number(el.dataset.b),d=Number(el.dataset.v);const a=(s.hrs||{}).alt||[];const b=a[kk];if(!b) return;b.dows=b.dows||[];const i=b.dows.indexOf(d);
      /* 1つの曜日は、1つの時間にだけ */
      if(el.checked&&i<0){b.dows.push(d);a.forEach((o,j)=>{if(j===kk||!o.dows) return;const x=o.dows.indexOf(d);if(x>=0){o.dows.splice(x,1);const cb=$('#bw-'+s.id+'-'+j+'-'+d);if(cb) cb.checked=false;}});}
      if(!el.checked&&i>=0) b.dows.splice(i,1);
      touch();return;
    }
    else if(k==='hrson'||k==='hrsst'||k==='hrsen'){s.hrs=s.hrs||{on:false,start:'09:00',end:'13:00',alt:[]};if(k==='hrson'){s.hrs.on=el.checked;touch();renderMain();return;}const v=el.value;if(v){if(k==='hrsst') s.hrs.start=v;else s.hrs.end=v;}touch();const hn=$('#hn-'+s.id);if(hn) hn.textContent=hrsNote(s);return;}
    else if(k==='qual'){s.quals=s.quals||[];const q=el.dataset.v,i=s.quals.indexOf(q);if(el.checked&&i<0) s.quals.push(q);if(!el.checked&&i>=0) s.quals.splice(i,1);touch();const ps=$('#patsum');if(ps) ps.outerHTML=patSum();return;}
    else if(k==='pat'){s.pat=s.pat||{};s.pat[el.dataset.v]=el.value;const lab=el.closest('.patcell');if(lab) lab.className='patcell '+(el.value?shCls(el.value):'pat-off');touch();const ps=$('#patsum');if(ps) ps.outerHTML=patSum();return;}
    else if(k==='dow'){const d=Number(el.dataset.v);const i=s.dows.indexOf(d);if(el.checked&&i<0) s.dows.push(d);if(!el.checked&&i>=0) s.dows.splice(i,1);}
    else{const v=clampInt(el.value,0,31);el.value=v;s[k]=v;}
    touch();
    const info=INFO();const nt=$('#note-'+s.id);if(nt) nt.textContent=staffNote(s,info);
    const sm=$('#staffsum');if(sm) sm.outerHTML=staffSum(info);
  }
};
const STAFF_ACTS={licadd:1,brkpick:1,me:1,stab:1,smonth:1,wish:1,donewish:1,adminlogin:1,pincancel:1,pinok:1,pinforgot:1,pinback:1,rcuse:1,ulunlock:1,rcdone:1,closemodal:1,rqopen:1,rqreason:1,rqsend:1,rqclose:1,rqcancel:1,punch:1,tcback:1};
const sig=el=>el&&el.dataset&&el.dataset.act?[el.dataset.act,el.dataset.v||'',el.dataset.s||'',el.dataset.d||''].join('|'):null;
document.addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('[data-act]'):null;if(!b||b.disabled) return;
  const fn=ACT[b.dataset.act];if(!fn) return;
  if(LIC.state==='none'||LIC.state==='checking'){if(!GATE_ACTS[b.dataset.act]) return;}
  else if(LIC.state==='expired'&&!VIEW_ACTS[b.dataset.act]){toast('ご利用の期限が切れているため、見ることだけできます');return;}
  if(S.mode==='staff'&&!STAFF_ACTS[b.dataset.act]) return;
  const key=sig(b);const wrap=$('.tbl-wrap');const sl=wrap?wrap.scrollLeft:0;const before=document.activeElement;
  fn(b.dataset.v,b);
  const w2=$('.tbl-wrap');if(w2&&sl) w2.scrollLeft=sl;
  if(key&&before===b&&!document.body.contains(b)){
    const els=document.querySelectorAll('[data-act]');
    for(let i=0;i<els.length;i++){if(sig(els[i])===key){try{els[i].focus({preventScroll:true});}catch(err){}break;}}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el||!el.dataset) return;
  if(LIC.state!=='ok'&&LIC.state!=='legacy'){if(el.id!=='lic-in'&&(el.dataset.bind||el.dataset.chg)){toast(LIC.state==='expired'?'ご利用の期限が切れているため、見ることだけできます':'ご利用の登録をお願いします');renderMain();}return;}
  if(el.dataset.bind){
    let val;
    if(el.type==='checkbox') val=el.checked;
    else if(el.type==='number'){val=clampInt(el.value,el.min,el.max);el.value=val;}
    else val=el.value;
    const ks=el.dataset.bind.split('.');let o=S;for(let i=0;i<ks.length-1;i++) o=o[ks[i]];o[ks[ks.length-1]]=val;
    if(el.dataset.bind==='facility.name'){save();const f=$('#apptitle');if(f) f.innerHTML=titleHTML();syncTabTitle();return;}
    touch();
    if(el.dataset.after==='cal'){renderTop();$('#jcal').innerHTML=jokenCal(INFO());}
    return;
  }
  if(el.dataset.chg&&CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape') return;if(!$('#modal').hidden) $('#modal').hidden=true;if(!$('#cellm').hidden) closeCell();if(!$('#pin').hidden) closePin();});
document.addEventListener('click',e=>{if(e.target&&e.target.id==='cellm') closeCell();});
/* 暗証番号の欄でEnterを押したときも決定にする（フォームの送信は使わない） */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target&&e.target.id==='q-new'){e.preventDefault();if(LIC.state==='ok'||LIC.state==='legacy') ACT.qadd();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target&&e.target.closest&&e.target.closest('#pin-form')&&e.target.tagName==='INPUT'){e.preventDefault();if(e.target.id==='rc-in') rcUse();else if(e.target.id==='ul-in') ulUnlock();else pinSubmit();}});
/* 職員用の画面で5分さわらなかったら、名前の選択にもどす（共有の端末なので） */
let lastTouch=Date.now();
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now();},true));
setInterval(()=>{const c=document.getElementById('tc-clock');if(c) c.innerHTML=clockHTML();},1000);
setInterval(()=>{if(S.mode==='staff'&&UI.me&&Date.now()-lastTouch>5*60*1000){UI.me=null;renderMain();toast('しばらく操作がなかったので、名前の選択にもどりました');}},20000);

/* 印刷のときは明るい色で出す */
let themeBefore;
window.addEventListener('beforeprint',()=>{themeBefore=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme','light');});
window.addEventListener('afterprint',()=>{if(themeBefore==null) document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',themeBefore);});

/* アプリを開いたまま、同じタブで利用リンクを開いたとき（アドレスの # だけが変わる） */
window.addEventListener('hashchange',()=>{
  let t=null;try{t=tokFrom(location.hash);}catch(e){}if(!t) return;
  licAddText(t).then(r=>{
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(!r.ok){LIC.badUrl=true;render();toast(r.msg);return;}
    LIC.badUrl=false;render();window.scrollTo(0,0);
    toast(r.mine?r.o.n+' 様として登録しました':'登録しました。この利用リンクで使えるのは「'+(r.o.a||[]).map(c=>APP_LABEL[c]).join('」「')+'」です');
  });
});
licInit().catch(()=>{LIC.state=LIC.legacy?'legacy':'none';}).then(()=>{
  render();
  if(LIC.justAdded&&(LIC.justAdded.a||[]).indexOf(APP_CODE)>=0) toast(LIC.justAdded.n+' 様として登録しました');
  else if(LIC.justAdded) toast('登録しました。この利用リンクで使えるのは「'+(LIC.justAdded.a||[]).map(c=>APP_LABEL[c]).join('」「')+'」です');
});
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('downloads').then(ns=>{if(ns){DL=ns;if(UI.view==='zentai'||UI.view==='kojin'||UI.view==='tc'){const wrap=$('.tbl-wrap');const sl=wrap?wrap.scrollLeft:0;renderMain();const w2=$('.tbl-wrap');if(w2) w2.scrollLeft=sl;}}}).catch(()=>{});
}
})();
</script>
