<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ほほえみ勤務表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style id="hk-css">
/* layout: 一枚の画用紙。上に園の絵と対象の月、①〜⑤の順に進むタブ、その下に縫い目で区切った大きな紙。 */
:root{
  --bg:#FFF3E8; --dot:rgba(226,170,130,.20); --paper:#FFFDF9; --paper-2:#FFF7EE;
  --ink:#4B3A33; --muted:#86726A; --line:#F0DDCD; --line-strong:#E2C7B3;
  --cocoa:#5A4034; --on-cocoa:#FFF6EC; --coral:#EE7F6E; --coral-ink:#B24637;
  --e-bg:#FFE6AE; --e-fg:#754700; --n-bg:#CFEED8; --n-fg:#1D5A3B; --l-bg:#DEDAFA; --l-fg:#41368A;
  --w-bg:#FFD8DE; --w-fg:#962E48; --p-bg:#D4ECF6; --p-fg:#1D526E;
  --k3-bg:#FFDCC8; --k3-fg:#8C3A10; --k4-bg:#C8EFEA; --k4-fg:#0E5650; --k5-bg:#E5F3B5; --k5-fg:#485A0C; --k6-bg:#F6D3F0; --k6-fg:#7D2A70; --k7-bg:#DCE3EA; --k7-fg:#34495E;
  --off-fg:#9C8A7E; --closed-bg:#F4E9DE;
  --sat:#32699F; --sun-day:#C24A35; --warn-bg:#FFE7D2; --warn-fg:#8F4310; --ok-bg:#DCF2E3; --ok-fg:#1D5A3B;
  --sun:#F9B93E; --sun-ray:#F29A3A; --moon:#F7DA7B; --cheek:#F7A9A0; --chick:#FFD95E; --chick-shade:#F6C343; --beak:#F29A3A; --cup:#F3A6B4; --face:#5A4034;
  --shadow:0 2px 0 rgba(120,84,60,.07),0 14px 28px -18px rgba(120,84,60,.45);
  --scene-filter:none;
  --font-display:'Kiwi Maru','Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --font-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A201B; --dot:rgba(255,220,190,.06); --paper:#372B25; --paper-2:#41332C;
    --ink:#F7EADF; --muted:#C6AF9F; --line:#54433A; --line-strong:#6C574B;
    --cocoa:#F4DCC6; --on-cocoa:#3A2A22; --coral:#F29080; --coral-ink:#FFB8AB;
    --e-bg:#6A4A12; --e-fg:#FFE3A8; --n-bg:#21503A; --n-fg:#C6F0D6; --l-bg:#3F3777; --l-fg:#DDD7FF;
    --w-bg:#6B2C3B; --w-fg:#FFD4DC; --p-bg:#214C63; --p-fg:#CFEBF8;
    --k3-bg:#6B3518; --k3-fg:#FFD5BE; --k4-bg:#144F4A; --k4-fg:#BFF2EB; --k5-bg:#45520F; --k5-fg:#E6F5B0; --k6-bg:#5E2557; --k6-fg:#F9D2F2; --k7-bg:#36414D; --k7-fg:#D8E2EC;
    --off-fg:#B39E90; --closed-bg:#30251F;
    --sat:#8DB9EA; --sun-day:#FF9C8A; --warn-bg:#5A3A1C; --warn-fg:#FFD9B0; --ok-bg:#21503A; --ok-fg:#C6F0D6;
    --shadow:0 2px 0 rgba(0,0,0,.2),0 14px 28px -18px rgba(0,0,0,.7);
    --scene-filter:brightness(.9) saturate(.95);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A201B; --dot:rgba(255,220,190,.06); --paper:#372B25; --paper-2:#41332C;
  --ink:#F7EADF; --muted:#C6AF9F; --line:#54433A; --line-strong:#6C574B;
  --cocoa:#F4DCC6; --on-cocoa:#3A2A22; --coral:#F29080; --coral-ink:#FFB8AB;
  --e-bg:#6A4A12; --e-fg:#FFE3A8; --n-bg:#21503A; --n-fg:#C6F0D6; --l-bg:#3F3777; --l-fg:#DDD7FF;
  --w-bg:#6B2C3B; --w-fg:#FFD4DC; --p-bg:#214C63; --p-fg:#CFEBF8;
  --k3-bg:#6B3518; --k3-fg:#FFD5BE; --k4-bg:#144F4A; --k4-fg:#BFF2EB; --k5-bg:#45520F; --k5-fg:#E6F5B0; --k6-bg:#5E2557; --k6-fg:#F9D2F2; --k7-bg:#36414D; --k7-fg:#D8E2EC;
  --off-fg:#B39E90; --closed-bg:#30251F;
  --sat:#8DB9EA; --sun-day:#FF9C8A; --warn-bg:#5A3A1C; --warn-fg:#FFD9B0; --ok-bg:#21503A; --ok-fg:#C6F0D6;
  --shadow:0 2px 0 rgba(0,0,0,.2),0 14px 28px -18px rgba(0,0,0,.7);
  --scene-filter:brightness(.9) saturate(.95);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.app{max-width:1200px;margin-inline:auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* ---- illustration paint ---- */
.ic{width:1.45em;height:1.45em;flex:none}
.k-sun{fill:var(--sun)} .k-ray{stroke:var(--sun-ray)} .k-line{stroke:var(--sun-ray)}
.k-face{fill:var(--face)} .k-smile{stroke:var(--face)} .k-cheek{fill:var(--cheek)}
.k-moon{fill:var(--moon)} .k-cup{fill:var(--cup)} .k-cupline{stroke:var(--cup)} .k-steam{stroke:var(--muted)}
.k-chick{fill:var(--chick)} .k-wing{fill:var(--chick-shade)} .k-beak{fill:var(--beak)} .k-foot{stroke:var(--beak)}
.k-clockface{fill:var(--paper)} .k-clockrim{stroke:var(--muted)} .k-hand{stroke:var(--coral)}
.chick{width:64px;height:64px;flex:none}
.scene{display:block;width:100%;height:auto;filter:var(--scene-filter)}

/* ---- top ---- */
.hero{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:22px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-weight:700;color:var(--coral-ink);letter-spacing:.06em;font-size:14px;overflow-wrap:anywhere}
h1{font-size:clamp(28px,4.4vw,40px);color:var(--cocoa);letter-spacing:.04em}
.lede{color:var(--muted);max-width:34em}
.monthbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.mbtn{appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line-strong);background:var(--paper);font-size:22px;line-height:1;cursor:pointer;color:var(--cocoa)}
.mlabel{font-family:var(--font-display);font-size:22px;font-weight:500;min-width:6.2em;text-align:center;font-variant-numeric:tabular-nums}
.mnote{background:var(--n-bg);color:var(--n-fg);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--e-bg);color:var(--e-fg);border-radius:18px;padding:12px 16px;margin-top:14px}
.sample p{flex:1 1 260px;min-width:0;font-weight:500}

/* ---- steps ---- */
.steps{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:8px}
.step .snum-ic{width:24px;height:24px}
.step-tc{border-style:dashed}
.step{appearance:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;min-height:62px;border-radius:18px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--muted);font-weight:700}
.step .snum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);border:2px solid var(--line-strong);font-size:12px;line-height:1;font-variant-numeric:tabular-nums}
.step .slabel{font-size:13px;white-space:nowrap}
.step[aria-current="page"]{background:var(--cocoa);border-color:var(--cocoa);color:var(--on-cocoa)}
.step[aria-current="page"] .snum{background:var(--coral);border-color:var(--coral);color:var(--on-cocoa)}

/* ---- paper ---- */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
.panel > section{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > section + section{border-top:2px dashed var(--line);padding-top:22px}
h2{font-size:20px;color:var(--cocoa);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral);flex:none}
.hint{color:var(--muted);font-size:14px;max-width:46em}
.next{display:flex;justify-content:flex-end;border-top:2px dashed var(--line);padding-top:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line-strong);background:var(--paper);font-weight:700;cursor:pointer;text-align:center}
.btn.primary{background:var(--cocoa);border-color:var(--cocoa);color:var(--on-cocoa)}
.btn.big{min-height:54px;padding:0 28px;font-size:17px}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:4px}
@media (hover:hover){ .btn:hover,.mbtn:hover,.step:hover{filter:brightness(.97)} }
.iconbtn{appearance:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper-2);cursor:pointer;font-size:18px;line-height:1;color:var(--muted);flex:none}

input[type=text],input[type=number],input[type=time],select,textarea{background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:6px 10px;min-height:42px;max-width:100%}
input[type=number]{width:5em;text-align:right;font-variant-numeric:tabular-nums}
input.wide{width:min(100%,26em)}
textarea{width:100%;min-height:84px;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px;color:var(--muted);font-weight:700}
.fld input{width:100%;color:var(--ink);font-weight:400;font-size:15px}
.fld input[type=number]{text-align:center}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.pill.big{font-size:15px;padding:5px 14px}
.pE{background:var(--e-bg);color:var(--e-fg)} .pN{background:var(--n-bg);color:var(--n-fg)} .pL{background:var(--l-bg);color:var(--l-fg)}
.pW{background:var(--w-bg);color:var(--w-fg)} .pP{background:var(--p-bg);color:var(--p-fg)} .pO{background:var(--closed-bg);color:var(--muted)}

.shiftlist{display:flex;flex-direction:column;gap:10px}
.shiftrow{display:grid;grid-template-columns:118px minmax(0,1.3fr) 4.6em repeat(4,minmax(0,1fr)) 40px;grid-template-areas:"pill name ab st en wk we del";gap:10px;align-items:end;background:var(--paper-2);border-radius:18px;padding:12px}
.shiftrow .pill{justify-self:start;align-self:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.shiftrow .iconbtn{align-self:center;background:var(--paper)}
.shiftrow .iconbtn:disabled{opacity:.35;cursor:default}
.sh-pill{grid-area:pill} .sh-name{grid-area:name} .sh-ab{grid-area:ab} .sh-st{grid-area:st} .sh-en{grid-area:en} .sh-wk{grid-area:wk} .sh-we{grid-area:we} .sh-del{grid-area:del}
.sh-ab input{text-align:center}
.shiftrow input{background:var(--paper)}
.shadd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
@media (max-width:1000px){.shiftrow{grid-template-columns:repeat(4,minmax(0,1fr)) 40px;grid-template-areas:"pill name name ab del" "st en wk we we"}}
@media (max-width:560px){.shiftrow{grid-template-columns:repeat(2,minmax(0,1fr)) 40px;grid-template-areas:"pill pill del" "name ab ab" "st en en" "wk we we"}}

.chk{position:relative;display:inline-flex}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chk span{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);color:var(--muted);font-weight:700}
.chk input:checked + span{background:var(--n-bg);border-color:var(--n-bg);color:var(--n-fg)}
.chk input:focus-visible + span{outline:3px solid var(--coral);outline-offset:2px}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* ---- calendars ---- */
.cal{display:flex;flex-direction:column;gap:4px;width:100%;max-width:540px}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal-head .d0{color:var(--sun-day)} .cal-head .d6{color:var(--sat)}
.cday,.wday{appearance:none;border:2px solid transparent;border-radius:12px;min-height:52px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;line-height:1.25;font-variant-numeric:tabular-nums;min-width:0}
.cday b,.wday b{font-size:15px}
.cday small,.wday small{font-size:11px;font-weight:700;white-space:nowrap}
.cday.is-open{background:var(--n-bg);color:var(--n-fg)}
.cday.is-closed{background:var(--closed-bg);color:var(--off-fg)}
.cday.is-hol b{text-decoration:underline wavy;text-underline-offset:3px}
.wday{background:var(--paper-2);border-color:var(--line);color:var(--ink)}
.wday.st-W{background:var(--w-bg);border-color:var(--w-bg);color:var(--w-fg)}
.wday.st-P{background:var(--p-bg);border-color:var(--p-bg);color:var(--p-fg)}
.wday.st-H{background:linear-gradient(135deg,var(--p-bg) 50%,var(--paper) 50%);border-color:var(--p-bg);color:var(--p-fg)}
.wday:disabled{background:var(--closed-bg);border-color:transparent;color:var(--off-fg);cursor:default}

/* ---- staff ---- */
.stafflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.staff{background:var(--paper-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.staff input[type=text],.staff select,.staff input[type=number]{background:var(--paper)}
.st-head{display:flex;gap:8px;align-items:center}
.st-head input{flex:1 1 auto;min-width:0;font-weight:700}
.st-row{display:flex;flex-direction:column;gap:4px}
.st-row .lab{font-size:13px;font-weight:700;color:var(--muted)}
.staff .chk span{min-width:38px;min-height:36px;padding:0 8px;background:var(--paper)}
.staff .chk input:checked + span{background:var(--n-bg)}
.st-note{font-size:13px;color:var(--muted)}
.implist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.implist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--paper-2);border-radius:12px;padding:8px 12px}
.imp-fld{align-self:stretch}
.imp-fld textarea{width:100%;min-height:64px}
.delask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.sum{border-radius:16px;padding:10px 14px;font-weight:500}
.sum.ok{background:var(--ok-bg);color:var(--ok-fg)} .sum.warn{background:var(--warn-bg);color:var(--warn-fg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;min-height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line-strong);background:var(--paper);cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--cocoa);border-color:var(--cocoa);color:var(--on-cocoa)}
.chip small{font-weight:500;opacity:.85;margin-left:4px}
.wishlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wishlist li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.wishlist b{min-width:7em}

/* ---- status ---- */
.status{border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.status .chick{width:48px;height:48px}
.status.ok{background:var(--ok-bg);color:var(--ok-fg);align-items:center;font-weight:700}
.status.warn{background:var(--warn-bg);color:var(--warn-fg)}
.status ul{margin:4px 0 0;padding-left:1.2em}
.status li{overflow-wrap:anywhere}
.stale{background:var(--p-bg);color:var(--p-fg);border-radius:14px;padding:8px 14px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;list-style:none;margin:0;padding:0}
.legend li{display:inline-flex}

/* ---- roster table ---- */
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:18px;background:var(--paper);max-width:100%}
.roster{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.roster th,.roster td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;height:34px;min-width:27px;font-weight:500}
.roster tr > :last-child{border-right:0}
.roster tfoot tr:last-child > *{border-bottom:0}
.roster .namecol{position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;padding:2px 10px;white-space:nowrap;min-width:104px;font-weight:700;border-right:2px solid var(--line-strong)}
.roster .namecol small{display:block;font-size:10px;font-weight:500;color:var(--muted);line-height:1.1}
.roster thead th{background:var(--paper-2);height:42px}
.roster thead .namecol{background:var(--paper-2)}
.dcol span{display:block;line-height:1.2}
.dcol .dwk{font-size:10px}
.dcol.satc{color:var(--sat)} .dcol.sunc{color:var(--sun-day)}
.roster .closed{background:var(--closed-bg)}
.roster thead .dcol.closed{background:var(--closed-bg)}
.cellbtn{appearance:none;border:0;border-radius:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center;width:100%;height:34px;min-width:27px;font-weight:700;background:transparent;cursor:pointer}
span.cellbtn{cursor:default}
.cellbtn:focus-visible{outline-offset:-3px}
.cE{background:var(--e-bg);color:var(--e-fg)} .cN{background:var(--n-bg);color:var(--n-fg)} .cL{background:var(--l-bg);color:var(--l-fg)}
.cW{background:var(--w-bg);color:var(--w-fg)} .cP{background:var(--p-bg);color:var(--p-fg)} .cOff{color:var(--off-fg)}
.cellbtn.hp{position:relative}
.cellbtn.hp::after{content:'半';position:absolute;top:1px;right:1px;font-size:9px;line-height:1;font-weight:700;color:var(--p-fg);background:var(--p-bg);border-radius:3px;padding:1px 2px}
.hpkey{display:inline-block;font-size:10px;line-height:1;font-weight:700;color:var(--p-fg);background:var(--paper);border-radius:3px;padding:1px 3px;margin-right:2px}
.ohp{font-size:10px;font-weight:700;color:var(--p-fg)}
.roster .tot{min-width:32px;background:var(--paper-2);padding:0 4px}
.roster .tot.strong{font-weight:700}
.roster tfoot td{font-weight:700}
.roster tfoot .short{background:var(--warn-bg);color:var(--warn-fg);font-size:11px}
.roster tfoot .namecol{font-weight:500;font-size:12px}

/* ---- personal sheet ---- */
.sheets{display:flex;flex-direction:column;gap:18px}
.psheet{background:var(--paper);border:2px solid var(--line-strong);border-radius:26px;padding:16px 16px 18px;width:100%;max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.bunting{display:block;width:100%;max-width:520px;height:auto;margin-inline:auto}
.ps-head{display:flex;gap:12px;align-items:center}
.ps-head > div{min-width:0}
.ps-fac{font-size:13px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.ps-head h3{font-size:20px;color:var(--cocoa)}
.ps-name{font-size:17px;overflow-wrap:anywhere}
.ps-name strong{font-size:21px;font-family:var(--font-display);font-weight:500}
.pcal{max-width:none}
.pday{border-radius:12px;min-height:76px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper-2);line-height:1.25;min-width:0;font-variant-numeric:tabular-nums}
.pnum{font-size:13px;font-weight:700}
.plab{font-size:13px;font-weight:700;white-space:nowrap}
.ptime{font-size:10.5px;text-align:center;white-space:nowrap}
.pday.t-E{background:var(--e-bg);color:var(--e-fg)} .pday.t-N{background:var(--n-bg);color:var(--n-fg)} .pday.t-L{background:var(--l-bg);color:var(--l-fg)}
.pday.t-W{background:var(--w-bg);color:var(--w-fg)} .pday.t-P{background:var(--p-bg);color:var(--p-fg)}
.pday.t-closed{background:var(--closed-bg);color:var(--off-fg)} .pday.t-off{color:var(--off-fg)}
.ps-foot{text-align:center;color:var(--muted);font-family:var(--font-display)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 0}
.empty .chick{width:92px;height:92px}
.empty h2::before{display:none}
.empty p{color:var(--muted);max-width:30em}

.foot{color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;max-width:560px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--cocoa);color:var(--on-cocoa);padding:10px 18px;border-radius:22px;font-weight:700;text-align:center;z-index:30;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(40,28,22,.55)}
.modal-box{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px;width:min(100%,520px);display:flex;flex-direction:column;gap:10px}
.backup summary{cursor:pointer;font-weight:700;color:var(--muted)}
.backup > div{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-top:10px}

/* ---- staff screen ---- */
.wday.is-locked{background:var(--paper-2);border-color:var(--line);color:var(--ink)}
.wday.is-locked.st-W{background:var(--w-bg);border-color:var(--w-bg);color:var(--w-fg)}
.wday.is-locked.st-P{background:var(--p-bg);border-color:var(--p-bg);color:var(--p-fg)}
.wday.is-locked.st-H{background:linear-gradient(135deg,var(--p-bg) 50%,var(--paper) 50%);border-color:var(--p-bg);color:var(--p-fg)}
.picker-head{display:flex;align-items:center;gap:14px}
.picker-head .chick{width:72px;height:72px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.namebtn{appearance:none;min-height:72px;border-radius:20px;border:2px solid var(--line-strong);background:var(--paper-2);cursor:pointer;font-family:var(--font-display);font-size:20px;color:var(--cocoa);display:flex;flex-wrap:wrap;align-items:baseline;align-content:center;justify-content:center;gap:4px;padding:16px 12px;overflow-wrap:anywhere;line-height:1.3}
.namebtn small{font-family:var(--font-body);font-size:13px;color:var(--muted);white-space:nowrap}
@media (hover:hover){.namebtn:hover{background:var(--e-bg)}}
.me-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.me-name{display:flex;align-items:center;gap:10px;font-size:17px}
.me-name .chick{width:52px;height:52px}
.me-name strong{font-family:var(--font-display);font-size:24px;font-weight:500;color:var(--cocoa)}
.pubbar,.accept{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.accept .hint{flex:1 1 220px}
.modepill{background:var(--l-bg);color:var(--l-fg);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px;align-self:flex-start}
.tostaff{margin-left:auto}
.roster tr.me > th.namecol{background:var(--w-bg);color:var(--w-fg)}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.credit{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:8px;opacity:.85}
#apptitle{overflow-wrap:anywhere}
#apptitle .tw{display:inline-block}
#pin-form{display:flex;flex-direction:column;gap:12px}
#pin-form input{width:100%;font-size:22px;letter-spacing:.3em;text-align:center}
.pin-err{color:var(--warn-fg);background:var(--warn-bg);border-radius:10px;padding:6px 10px;font-weight:700}
#pin .modal-box{max-height:calc(100dvh - 32px);overflow:auto}
#pin-form h3{margin:0;font-size:16px;font-family:var(--font-display);color:var(--cocoa)}
.pin-sub{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.rc-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:.06em;text-align:center;background:var(--paper-2);border:2px dashed var(--line-strong);border-radius:14px;padding:14px 8px;color:var(--cocoa);overflow-wrap:anywhere}
.rc-ask{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:.12em;text-align:center;color:var(--cocoa)}
#pin-form input.code{letter-spacing:.12em}
.rc-state{border-radius:12px;padding:8px 12px;font-weight:500}
.rc-state.ok{background:var(--ok-bg);color:var(--ok-fg)}
.rc-state.no{background:var(--warn-bg);color:var(--warn-fg)}

/* ---- time card ---- */
.tc-punch{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--paper-2);border-radius:22px;padding:18px 14px}
.tc-clock{font-family:var(--font-display);font-size:clamp(44px,11vw,64px);line-height:1.1;color:var(--cocoa);font-variant-numeric:tabular-nums}
.tc-clock small{font-size:.45em;color:var(--muted)}
.tc-date{color:var(--muted);font-weight:700}
.tc-status{font-weight:700;font-size:17px}
.tc-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:460px;margin-top:8px}
.tcbtn{appearance:none;border:0;border-radius:24px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-display);font-size:24px;cursor:pointer;box-shadow:var(--shadow)}
.tcbtn .ic{width:40px;height:40px}
.tcbtn.in{background:var(--e-bg);color:var(--e-fg)}
.tcbtn.out{background:var(--l-bg);color:var(--l-fg)}
.tcbtn:disabled{opacity:.4;cursor:default;box-shadow:none}
.tc-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 0}
.tc-done .chick{width:96px;height:96px}
.tc-done-msg{font-family:var(--font-display);font-size:26px;color:var(--cocoa)}
.tc-done b{font-size:22px;font-variant-numeric:tabular-nums}
.nb-dot{font-family:var(--font-body);font-size:11px;font-weight:700;background:var(--n-bg);color:var(--n-fg);border-radius:999px;padding:1px 8px;margin-left:6px;align-self:center;white-space:nowrap}
.todaygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px;list-style:none;margin:0;padding:0}
.todaygrid li{background:var(--paper-2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.todaygrid b{overflow-wrap:anywhere}
.todaygrid span{font-size:13px;font-variant-numeric:tabular-nums}
.tcwrap{position:relative;overflow-x:auto;border:2px solid var(--line);border-radius:16px;max-width:100%}
.tctable{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.tctable th,.tctable td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tctable th:first-child,.tctable td:first-child{text-align:left}
.tctable thead th{background:var(--paper-2);font-size:12px;color:var(--muted)}
.tctable tfoot th,.tctable tfoot td{background:var(--e-bg);color:var(--e-fg);font-weight:700;border-bottom:0}
.tctable .big{font-weight:700}
.tctable input[type=time]{min-height:36px;padding:2px 6px;width:7.4em}
.tctable tr.off td{color:var(--off-fg)}
.tc-miss{color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:12px}
.tc-ed{color:var(--p-fg);background:var(--p-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:11px;margin-left:4px}
.snapnote{font-size:13px;color:var(--muted)}
.mytc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.mytc li{display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--paper-2);border-radius:12px;padding:6px 12px}
.mytc li b{min-width:5.5em}

/* ---- 作り方・固定パターン・交代 ---- */
.modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.modecard{appearance:none;text-align:left;border:2px solid var(--line-strong);background:var(--paper-2);border-radius:18px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.modecard b{font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--cocoa)}
.modecard span{font-size:13px;color:var(--muted)}
.modecard[aria-checked="true"]{border-color:var(--e-fg);background:var(--e-bg)}
.modecard[aria-checked="true"] b,.modecard[aria-checked="true"] span{color:var(--e-fg)}
.patgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.patcell{display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700;border-radius:10px;padding:4px 2px 2px;background:var(--paper);color:var(--muted);min-width:0}
.patcell select{width:100%;min-height:34px;padding:0 2px;text-align:center;text-align-last:center;background:transparent;border:0;font-weight:700;color:inherit}
.patcell.pat-E{background:var(--e-bg);color:var(--e-fg)} .patcell.pat-N{background:var(--n-bg);color:var(--n-fg)} .patcell.pat-L{background:var(--l-bg);color:var(--l-fg)}
.cellbtn.sub{box-shadow:inset 0 -4px 0 var(--coral)}
.subkey{display:inline-block;padding:0 4px;box-shadow:inset 0 -3px 0 var(--coral);font-weight:700}
.onsub{text-decoration:underline wavy var(--coral);text-underline-offset:3px}
.psub{font-size:10px;font-weight:700;background:var(--paper);color:var(--coral-ink);border-radius:6px;padding:0 4px}
.psub.hpsub{color:var(--p-fg)}
/* ---- 打刻もれの申請 ---- */
.step{position:relative}
.stbadge{position:absolute;top:4px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--sun-day);color:var(--paper);font-size:12px;line-height:20px;font-weight:700}
.panel > section.reqbox{background:var(--warn-bg);color:var(--warn-fg);border-top:0;border-radius:18px;padding:14px 16px}
.panel > section.reqbox h2{color:var(--warn-fg)}
.reqlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reqlist li{background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rq-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rq-diff{font-variant-numeric:tabular-nums;font-size:14px;line-height:1.8}
.tc-ap{color:var(--n-fg);background:var(--n-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:11px;margin-left:4px;white-space:nowrap}
.tc-pl{color:var(--p-fg);background:var(--p-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:12px;margin-left:4px;white-space:nowrap}
.tc-src{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.tc-pd{display:block;font-size:12px;font-weight:500;color:var(--muted);white-space:normal;max-width:16em;margin-left:auto}
.tc-brk-note{font-size:12px;color:var(--muted)}
.tctable select{min-height:36px;padding:2px 6px;font-size:14px}
.tctable select.on{background:var(--p-bg);color:var(--p-fg);border-color:transparent;font-weight:700}
.tc-brkpick{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper-2);border-radius:18px;padding:12px 16px;max-width:100%}
.tc-brkpick .chips{justify-content:center}
.tc-brkpick .lab{font-weight:700;color:var(--cocoa)}
.tc-net{font-weight:700;color:var(--cocoa);font-variant-numeric:tabular-nums}
.rqform{display:flex;flex-direction:column;gap:10px;background:var(--paper-2);border-radius:18px;padding:14px}
.rqform select{max-width:14em}
.rqform .fld input[type=time]{min-width:9em}
.myreq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.myreq li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--paper-2);border-radius:12px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}

/* ---- 資格 ---- */
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 40px;gap:10px 16px;align-items:end;background:var(--paper-2);border-radius:14px;padding:8px 12px}
.qgrp{border:0;margin:0;padding:0;display:flex;gap:6px;align-items:end;min-width:0}
.qgrp legend{font-size:12px;font-weight:700;color:var(--muted);padding:0;margin-bottom:2px}
.qgrp .fld input{width:4.6em}
.qname{font-weight:700;align-self:center;overflow-wrap:anywhere}
.qrow .iconbtn{align-self:center}
.qadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qadd input{flex:1 1 14em;min-width:0}
@media (max-width:560px){.qrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}.qname{grid-column:1 / -1}}
.roster td.ampm span,.roster th small.ampmh{display:block;line-height:1.2}
.roster td.ampm{font-size:11px;padding:2px 0}
.roster td.ampm .ng{background:var(--warn-bg);color:var(--warn-fg);border-radius:4px}
.roster tfoot th small.ampmh{font-size:10px;color:var(--muted);font-weight:500}
.ocount{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.ocount .oh{display:inline-block;margin-right:5px;color:var(--ink)}
.ocount .ng{color:var(--warn-fg);background:var(--warn-bg);border-radius:4px;padding:0 2px}
.qabbr{font-size:12px;color:var(--muted);margin-top:6px}
.hrsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hrsrow input[type=time]{min-height:38px}

/* ---- overall calendar ---- */
.viewtoggle{display:inline-flex;gap:4px;background:var(--paper-2);border:2px solid var(--line);border-radius:999px;padding:3px}
.viewtoggle .chip{min-height:38px;border:0}
.ocal-wrap{overflow-x:auto;max-width:100%;padding-bottom:4px}
.ocal{min-width:760px;max-width:none}
.oday{background:var(--paper-2);border-radius:12px;padding:6px 7px 7px;min-height:104px;display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;line-height:1.4}
.oday.closed{background:var(--closed-bg);color:var(--off-fg)}
.oday-top{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.oday-top b{font-size:15px;font-variant-numeric:tabular-nums}
.oday-top small{font-size:10px;color:var(--muted);font-weight:700}
.oday .sunc{color:var(--sun-day)} .oday .satc{color:var(--sat)}
.oline{display:flex;gap:4px;align-items:flex-start}
.otag{flex:none;width:20px;height:18px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:11px;line-height:1}
.onames{min-width:0;overflow-wrap:anywhere;font-weight:500}
.oclosed{margin:auto;font-weight:700;font-size:13px}
.oshort{align-self:flex-start;background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:0 6px;font-weight:700;font-size:11px}

/* ---- 勤務の色（k0＝早番の色、k1＝通常、k2＝遅番、k3〜k7＝追加した勤務） ---- */
.k0,.pill.k0,.cellbtn.k0,.pday.k0,.patcell.k0,.otag.k0,.cm-opt.k0{background:var(--e-bg);color:var(--e-fg)}
.k1,.pill.k1,.cellbtn.k1,.pday.k1,.patcell.k1,.otag.k1,.cm-opt.k1{background:var(--n-bg);color:var(--n-fg)}
.k2,.pill.k2,.cellbtn.k2,.pday.k2,.patcell.k2,.otag.k2,.cm-opt.k2{background:var(--l-bg);color:var(--l-fg)}
.k3,.pill.k3,.cellbtn.k3,.pday.k3,.patcell.k3,.otag.k3,.cm-opt.k3{background:var(--k3-bg);color:var(--k3-fg)}
.k4,.pill.k4,.cellbtn.k4,.pday.k4,.patcell.k4,.otag.k4,.cm-opt.k4{background:var(--k4-bg);color:var(--k4-fg)}
.k5,.pill.k5,.cellbtn.k5,.pday.k5,.patcell.k5,.otag.k5,.cm-opt.k5{background:var(--k5-bg);color:var(--k5-fg)}
.k6,.pill.k6,.cellbtn.k6,.pday.k6,.patcell.k6,.otag.k6,.cm-opt.k6{background:var(--k6-bg);color:var(--k6-fg)}
.k7,.pill.k7,.cellbtn.k7,.pday.k7,.patcell.k7,.otag.k7,.cm-opt.k7{background:var(--k7-bg);color:var(--k7-fg)}
.cellbtn.hb{position:relative}
.cellbtn.hb::before{content:attr(data-hb);position:absolute;top:1px;left:2px;font-size:9px;line-height:1;font-weight:700;opacity:.8}
.hbkey{display:inline-block;font-size:10px;line-height:1;font-weight:700;background:var(--paper);border-radius:3px;padding:1px 3px;margin-right:2px}
/* 職員ごとの勤務時間（時間1〜5） */
.bands{display:flex;flex-direction:column;gap:6px}
.band{display:grid;grid-template-columns:2.9em minmax(0,1fr) auto minmax(0,1fr);gap:4px 6px;align-items:center;background:var(--paper);border-radius:12px;padding:6px 8px}
.band input[type=time]{width:100%;min-width:0;padding:4px 4px 4px 8px;min-height:38px}
.band input[type=time]::-webkit-calendar-picker-indicator{margin:0 0 0 2px;padding:0}
.band .bnum{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.band .bdows{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.band .bdows .chk span{min-width:32px;min-height:32px;padding:0 5px;background:var(--paper-2)}
.band .bdows small{flex-basis:100%;font-size:11px;color:var(--muted);font-weight:700}
.band .bdows .iconbtn{width:34px;height:34px;font-size:15px;margin-left:auto}
.band .hint{grid-column:2 / -1;font-size:12px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
/* マスをタップしたときの選択画面 */
.cm-box{max-height:calc(100dvh - 32px);overflow:auto}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cm-opt{appearance:none;border:3px solid transparent;border-radius:14px;min-height:58px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;cursor:pointer;text-align:left;line-height:1.3}
.cm-opt b{display:flex;align-items:center;gap:4px;font-size:15px}
.cm-opt small{font-size:12px;font-weight:500}
.cm-opt[aria-pressed="true"]{border-color:var(--cocoa)}
.cm-opt.cm-off{background:var(--paper-2);color:var(--muted)}
.cm-sub{font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}

/* ---- ご利用の登録 ---- */
.licbar{background:var(--p-bg);color:var(--p-fg);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.licbar.warn{background:var(--warn-bg);color:var(--warn-fg)}
.licwho{font-weight:700;color:var(--cocoa)}
.gate{gap:14px}
.gate .gate-paste{width:min(100%,34em);text-align:left}
.gate .gate-paste textarea{min-height:72px}

/* ---- PDF ---- */
.bt0{fill:var(--coral)} .bt1{fill:var(--sun)} .bt2{fill:var(--n-bg)} .bt3{fill:var(--l-bg)} .bt4{fill:var(--p-bg)} .bt5{fill:var(--w-bg)} .bt-line{stroke:var(--line-strong)}
.outbox{display:flex;flex-direction:column;gap:8px;background:var(--paper-2);border-radius:18px;padding:12px 14px}
.outlab{font-weight:700;color:var(--cocoa);font-size:14px}
#pdf-stage{position:absolute;left:-30000px;top:0;pointer-events:none}
.pg{background:var(--paper);color:var(--ink);font-family:var(--font-body);display:flex;flex-direction:column;gap:12px}
.pg-portrait{width:794px;padding:26px 18px}
.pg-landscape{width:1123px;padding:20px 28px 22px}
.pg-head{display:flex;align-items:center;gap:14px}
.pg-head .chick{width:54px;height:54px}

<div class="app" id="app">
  <header id="top"></header>
  <nav class="steps no-print" id="steps" aria-label="勤務表づくりの順番"></nav>
  <main id="main"></main>
  <div class="foot no-print" id="foot"></div>
</div>
<div class="toast no-print" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal no-print" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <h2 id="modal-h">下の文字を選んでコピーしてください</h2>
    <p class="hint">この画面では自動でコピーできませんでした。</p>
    <textarea id="modal-ta" readonly rows="8" aria-label="コピーする内容"></textarea>

  <div class="modal-box cm-box" role="dialog" aria-modal="true" aria-labelledby="cm-h"><div id="cm-form"></div></div>
</div>

</div>

<script>
(function(){
'use strict';
/* どのアプリとして動くか：'roster'＝勤務表のみ／'timecard'＝タイムカードのみ／'both'＝両方 */
const APP='roster';
const HAS_ROSTER=APP!=='timecard',HAS_TC=APP!=='roster';

/*CORE-START*/
const DOW=['日','月','火','水','木','金','土'];
/* 勤務の種類。はじめは早番・通常・遅番の3つ（E・N・L）。事業所ごとに名前・時間を変えたり、8つまで増やしたりできる。
   S.shiftIds＝ならび順、S.shifts[id]＝{name,ab（表の文字）,abAuto,col（色）,start,end,wk,we,del（消したもの。前の月の表のために残す）} */
const SH_MAX=8,SH_COLS=8;
const SH_DEF={E:{name:'早番',col:0},N:{name:'通常',col:1},L:{name:'遅番',col:2}};
function shAll(S){return (S.shiftIds||['E','N','L']).filter(t=>S.shifts[t]);}
function shIds(S){return shAll(S).filter(t=>!S.shifts[t].del);}
function shName(S,t){const x=S.shifts[t];return (x&&x.name)||(SH_DEF[t]||{}).name||'勤務';}
/* 「遅番の次の日に早番を入れない」の早い勤務・遅い勤務。名前に「早」がつく勤務（早番・早朝など）が早い勤務、
   「遅」がつく勤務（遅番など）が遅い勤務（両方がつく勤務は、どちらにも入れない） */
function leSets(S){
  const early={},late={};
  shIds(S).forEach(t=>{const nm=shName(S,t);const e=nm.indexOf('早')>=0,l=nm.indexOf('遅')>=0;if(e&&!l) early[t]=1;if(l&&!e) late[t]=1;});
  if(!Object.keys(early).length||!Object.keys(late).length) return null;
  return {early:early,late:late};
}
/* 早い勤務でも遅い勤務でもない勤務（はじめの3つなら通常）。人を足すときは、まずこの勤務に入れる */
function midIds(S,LE){const ids=shIds(S);return LE?ids.filter(t=>!LE.early[t]&&!LE.late[t]):ids;}
const HCACHE={};

/* 日本の祝日（振替休日・国民の休日を含む） */
function holidaysOf(y){
  if(HCACHE[y]) return HCACHE[y];
  const h={};
  const add=(m,d,n)=>{h[m+'-'+d]=n;};
  const nthMon=(m,k)=>{const f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(k-1)*7;};
  const a=y-1980;
  add(1,1,'元日');add(1,nthMon(1,2),'成人の日');add(2,11,'建国記念の日');add(2,23,'天皇誕生日');
  add(3,Math.floor(20.8431+0.242194*a-Math.floor(a/4)),'春分の日');
  add(4,29,'昭和の日');add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');
  add(7,nthMon(7,3),'海の日');add(8,11,'山の日');add(9,nthMon(9,3),'敬老の日');
  add(9,Math.floor(23.2488+0.242194*a-Math.floor(a/4)),'秋分の日');
  add(10,nthMon(10,2),'スポーツの日');add(11,3,'文化の日');add(11,23,'勤労感謝の日');
  const key=dt=>(dt.getMonth()+1)+'-'+dt.getDate();
  const base=Object.keys(h);
  base.forEach(k=>{
    const p=k.split('-').map(Number);const dt=new Date(y,p[0]-1,p[1]);
    if(dt.getDay()===0){let nx=new Date(y,p[0]-1,p[1]+1);while(h[key(nx)]) nx=new Date(nx.getFullYear(),nx.getMonth(),nx.getDate()+1);if(nx.getFullYear()===y) h[key(nx)]='振替休日';}
  });
  base.forEach(k=>{
    const p=k.split('-').map(Number);const mid=new Date(y,p[0]-1,p[1]+1);const nxt=new Date(y,p[0]-1,p[1]+2);
    if(!h[key(mid)]&&base.indexOf(key(nxt))>=0&&mid.getDay()!==0&&mid.getFullYear()===y) h[key(mid)]='国民の休日';
  });
  HCACHE[y]=h;return h;
}

function monthInfo(S){
  const p=S.ym.split('-');const y=+p[0],m=+p[1];const n=new Date(y,m,0).getDate();
  const hol=holidaysOf(y);const ov=(S.dayOverride&&S.dayOverride[S.ym])||{};const days=[];
  for(let d=1;d<=n;d++){
    const dow=new Date(y,m-1,d).getDay();const holiday=hol[m+'-'+d]||'';
    let def=S.openDows.indexOf(dow)>=0;if(holiday&&S.closeHolidays) def=false;
    const open=(d in ov)?!!ov[d]:def;
    days.push({d:d,dow:dow,holiday:holiday,def:def,open:open,kind:(dow===0||dow===6||holiday)?'we':'wk'});
  }
  return {y:y,m:m,n:n,days:days};
}
/* 資格：職員はいくつでも持てる。資格ごとに1日に必要な人数（平日／土日祝） */
function hasQ(s,id){return (s.quals||[]).indexOf(id)>=0;}
/* 午前・午後：区切りの時刻より前に勤務していれば午前、後に勤務していれば午後に数える。職員ごとの勤務時間があればそれを使う */
const HALVES=['am','pm'],HALFN={am:'午前',pm:'午後'};
function hm(t){if(!t) return null;const p=String(t).split(':');const h=parseInt(p[0],10),m=parseInt(p[1],10);return isNaN(h)||isNaN(m)?null:h*60+m;}
function ownHrs(s){return !!(s&&s.hrs&&s.hrs.on&&hm(s.hrs.start)!=null&&hm(s.hrs.end)!=null);}
/* 職員ごとの勤務時間は5つまで（時間1＝s.hrs、時間2〜5＝s.hrs.alt）。時間2〜5は、えらんだ曜日に使う。
   勤務表のマスで日ごとに選び直したときは、その月の表の hb[職員][日]＝時間の番号（0＝時間1）に入る */
const HRS_MAX=5;
function bandOk(b){return !!(b&&hm(b.start)!=null&&hm(b.end)!=null);}
function bandAt(s,k){const b=k>0?(s.hrs.alt||[])[k-1]:s.hrs;return bandOk(b)?b:s.hrs;}
function bandByDow(s,w){const a=s.hrs.alt||[];for(let k=0;k<a.length;k++){if(bandOk(a[k])&&(a[k].dows||[]).indexOf(w)>=0) return k+1;}return 0;}
const DOWC={};
function dowOf(S,d){const k=S.ym+'-'+d;let v=DOWC[k];if(v==null){const p=S.ym.split('-');v=DOWC[k]=new Date(+p[0],+p[1]-1,d).getDay();}return v;}
function bandOf(S,s,d,hb){
  if(!ownHrs(s)) return -1;const n=(s.hrs.alt||[]).length;if(!n) return 0;
  const o=hb&&hb[s.id]?hb[s.id][d]:null;if(o!=null&&o>=0&&o<=n) return Number(o);
  return d?bandByDow(s,dowOf(S,d)):0;
}
function spanOf(S,s,t,d,hb,k){if(ownHrs(s)){const b=bandAt(s,k!=null?k:bandOf(S,s,d,hb));return [hm(b.start),hm(b.end)];}const sh=S.shifts[t]||{};const a=hm(sh.start),b=hm(sh.end);return [a==null?0:a,b==null?1440:b];}
function coversHalf(S,s,t,h,d,hb,k){const sp=spanOf(S,s,t,d,hb,k);const nb=hm(S.noon);const b=nb==null?720:nb;return h==='am'?sp[0]<b:sp[1]>b;}
function qNeed(q,day,h){return day.open?Math.max(0,Number(q[day.kind+(h==='am'?'AM':'PM')])||0):0;}
function qActive(q){return ['wkAM','wkPM','weAM','wePM'].some(k=>(Number(q[k])||0)>0);}
function qualReqs(S,day){const out=[];(S.qualList||[]).forEach(q=>{HALVES.forEach(h=>{const need=qNeed(q,day,h);if(need>0) out.push({id:q.id,name:q.name,half:h,need:need});});});return out;}
function qCount(S,cells,d,qid,h,hb){return S.staff.filter(s=>{const t=(cells[s.id]||{})[d];return t&&(qid==null||hasQ(s,qid))&&coversHalf(S,s,t,h,d,hb);}).length;}
function reqOf(S,day,t){return day.open?Math.max(0,Number(S.shifts[t][day.kind])||0):0;}
function wishOf(S,sid){return (S.wishes[S.ym]||{})[sid]||{};}
/* 希望の種類：W＝希望休、P＝有給（1日）、H＝有給（半日。その日は出勤の日として組む） */
function offWish(v){return v==='W'||v==='P';}
function paidDays(w){let n=0;for(const k in w){if(w[k]==='P') n+=1;else if(w[k]==='H') n+=0.5;}return n;}
function availCount(S,s,info){const w=wishOf(S,s.id);let c=0;info.days.forEach(day=>{if(day.open&&s.dows.indexOf(day.dow)>=0&&!offWish(w[day.d])) c++;});return c;}
/* その月に組む勤務日数。常勤は「月の日数 − 公休 − 有給」、パートは「勤務日数 − 有給」。 */
function targetOf(S,s,info){
  const w=wishOf(S,s.id);let paid=0;for(const k in w){if(w[k]==='P') paid++;}
  const base=s.type==='part'?(Number(s.work)||0):info.n-(Number(s.off)||0);
  return Math.max(0,Math.min(base-paid,availCount(S,s,info)));
}

function generate(S){
  const info=monthInfo(S);const days=info.days,n=info.n;const R=S.rules;const maxC=Math.max(1,Number(R.maxConsec)||5);
  const staff=S.staff.map(s=>{
    const w=wishOf(S,s.id);const av=new Array(n+2).fill(false);
    days.forEach(day=>{av[day.d]=day.open&&s.dows.indexOf(day.dow)>=0&&!offWish(w[day.d]);});
    return {id:s.id,can:s.can,av:av,target:targetOf(S,s,info),quals:s.quals||[],src:s};
  });
  const SHL=shIds(S);const LE=leSets(S);const mids=midIds(S,LE);const isMid={};mids.forEach(t=>{isMid[t]=1;});
  const zero=extra=>{const o=Object.assign({},extra);SHL.forEach(t=>{o[t]=0;});return o;};
  /* 早い勤務も遅い勤務もできる人（はじめの3つなら、早番も遅番もできる人） */
  const allIn=(s,set)=>Object.keys(set).every(t=>s.can[t]);
  staff.forEach(s=>{s.flex=!LE||(allIn(s,LE.early)&&allIn(s,LE.late));});
  const rq=new Array(n+2).fill(null);
  days.forEach(day=>{const o={};SHL.forEach(t=>{o[t]=reqOf(S,day,t);});rq[day.d]=o;});
  const rqSum=d=>{let x=0;SHL.forEach(t=>{x+=rq[d][t];});return x;};
  const weOpen=days.some(day=>day.open&&day.kind==='we');
  const qr=new Array(n+2).fill(null);days.forEach(day=>{qr[day.d]=qualReqs(S,day);});

  function buildOnce(){
    const A=staff.map(()=>new Array(n+2).fill(''));
    const c=staff.map(()=>zero({all:0,we:0}));
    const rem=staff.map(s=>s.av.filter(Boolean).length);
    const head=new Array(n+2).fill(0);
    const dc=[];for(let d=0;d<=n+1;d++) dc.push(zero());
    const runAt=(i,d)=>{let r=1;for(let x=d-1;x>=1&&A[i][x];x--) r++;for(let x=d+1;x<=n&&A[i][x];x++) r++;return r;};
    const can=(i,d,t)=>{
      const s=staff[i];
      if(A[i][d]||!s.av[d]||!s.can[t]||c[i].all>=s.target) return false;
      if(runAt(i,d)>maxC) return false;
      if(R.noLateEarly&&LE){if(LE.early[t]&&LE.late[A[i][d-1]]) return false;if(LE.late[t]&&LE.early[A[i][d+1]]) return false;}
      return true;
    };
    /* 足りない勤務がないときに入れる勤務の順。まず「通常」のような真ん中の勤務、なければ回数の少ない勤務から */
    const prefOf=(i,d)=>{
      const s=staff[i];const ms=mids.filter(x=>s.can[x]);
      if(ms.length) return ms.length>1?ms.slice().sort((x,y)=>((rq[d][y]>0)-(rq[d][x]>0))||(c[i][x]-c[i][y])):ms;
      return SHL.filter(x=>!isMid[x]).sort((x,y)=>c[i][x]-c[i][y]);
    };
    const put=(i,day,t)=>{A[i][day.d]=t;c[i][t]++;c[i].all++;if(day.kind==='we') c[i].we++;head[day.d]++;dc[day.d][t]++;};

    /* 1巡目：その日に必要な人数を、足りなくなりやすい勤務から順に埋める */
    days.forEach(day=>{
      const d=day.d;
      if(day.open){
        /* 0巡目：資格ごとの必要人数を、その資格を持つ人から先に入れる */
        qr[d].slice().sort(()=>Math.random()-0.5).forEach(q=>{
          const cov=(i,t)=>coversHalf(S,staff[i].src,t,q.half,d);
          let have=0;for(let i=0;i<staff.length;i++){if(A[i][d]&&staff[i].quals.indexOf(q.id)>=0&&cov(i,A[i][d])) have++;}
          while(have<q.need){
            let bi=-1,bt='',bc=Infinity;
            const order=SHL.slice().sort((x,y)=>(rq[d][y]-dc[d][y])-(rq[d][x]-dc[d][x]));
            for(let i=0;i<staff.length;i++){
              const s=staff[i];if(s.quals.indexOf(q.id)<0) continue;
              for(const t of order){
                if(!can(i,d,t)||!cov(i,t)) continue;
                const tg=Math.max(1,s.target);const urg=(s.target-c[i].all)/Math.max(1,rem[i]);
                let cost=-2.2*urg+9*(c[i][t]/tg)+Math.random()*0.4+(rq[d][t]-dc[d][t]>0?0:3);
                if(day.kind==='we') cost+=7*(c[i].we/tg);
                if(cost<bc){bc=cost;bi=i;bt=t;}
                break;
              }
            }
            if(bi<0) break;put(bi,day,bt);have++;
          }
        });
        const slack={};
        SHL.forEach(t=>{let k=0;for(let i=0;i<staff.length;i++){if(can(i,d,t)) k++;}slack[t]=k-rq[d][t]+Math.random()*0.2;});
        SHL.slice().sort((x,y)=>slack[x]-slack[y]).forEach(t=>{
          for(let k=dc[d][t];k<rq[d][t];k++){
            let bi=-1,bc=Infinity;
            for(let i=0;i<staff.length;i++){
              if(!can(i,d,t)) continue;
              const s=staff[i];const tg=Math.max(1,s.target);
              const urg=(s.target-c[i].all)/Math.max(1,rem[i]);
              let cost=-2.2*urg+9*(c[i][t]/tg)+Math.random()*0.4;
              if(day.kind==='we') cost+=7*(c[i].we/tg);
              if(LE&&isMid[t]&&!s.flex) cost-=0.3;
              if(cost<bc){bc=cost;bi=i;}
            }
            if(bi>=0) put(bi,day,t);
          }
        });
      }
      for(let i=0;i<staff.length;i++){if(staff[i].av[d]) rem[i]--;}
    });

    /* 2巡目：予定の勤務日数に届くまで、人数の少ない日から足していく（不足の穴埋めも兼ねる） */
    const order=staff.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=order[i];order[i]=order[j];order[j]=tmp;}
    let moved=true;
    while(moved){
      moved=false;
      for(const i of order){
        const s=staff[i];if(c[i].all>=s.target) continue;
        let bday=null,bt='',bc=Infinity;
        for(const day of days){
          const d=day.d;if(!day.open||A[i][d]||!s.av[d]) continue;
          let t='',bonus=0;
          for(const x of SHL){if(dc[d][x]<rq[d][x]&&can(i,d,x)){t=x;bonus=-6;break;}}
          if(!t){
            for(const x of prefOf(i,d)){if(can(i,d,x)){t=x;break;}}
          }
          if(!t) continue;
          const over=head[d]-rqSum(d);
          const cost=over+bonus+(day.kind==='we'?2.5:0)+0.12*runAt(i,d)+Math.random()*0.6;
          if(cost<bc){bc=cost;bday=day;bt=t;}
        }
        if(bday){put(i,bday,bt);moved=true;}
      }
    }

    let score=0;
    days.forEach(day=>{if(day.open) SHL.forEach(t=>{score+=Math.max(0,rq[day.d][t]-dc[day.d][t])*1000;});});
    staff.forEach((s,i)=>{score+=(s.target-c[i].all)*30;});
    days.forEach(day=>{qr[day.d].forEach(q=>{let have=0;for(let i=0;i<staff.length;i++){if(A[i][day.d]&&staff[i].quals.indexOf(q.id)>=0&&coversHalf(S,staff[i].src,A[i][day.d],q.half,day.d)) have++;}score+=Math.max(0,q.need-have)*900;});});
    const spread=(pick,val,wgt)=>{const v=[];staff.forEach((s,i)=>{if(s.target>0&&pick(s)) v.push(val(i)/s.target*20);});if(v.length>1) score+=(Math.max.apply(null,v)-Math.min.apply(null,v))*wgt;};
    /* 早い勤務・遅い勤務の回数が、人によってかたよらないようにする */
    if(LE) SHL.forEach(t=>{if(LE.early[t]||LE.late[t]) spread(s=>s.can[t],i=>c[i][t],6);});
    if(weOpen) spread(s=>days.some(day=>day.kind==='we'&&s.av[day.d]),i=>c[i].we,4);
    staff.forEach((s,i)=>{let r=0;for(let d=1;d<=n+1;d++){if(A[i][d]) r++;else{if(r>=maxC) score+=0.5;r=0;}}});

    const cells={};
    staff.forEach((s,i)=>{cells[s.id]={};for(let d=1;d<=n;d++){if(A[i][d]) cells[s.id][d]=A[i][d];}});
    return {cells:cells,score:score};
  }

  const iter=staff.length>24?70:staff.length>12?120:180;
  let best=null;
  for(let k=0;k<iter;k++){const r=buildOnce();if(!best||r.score<best.score) best=r;}
  return best?best.cells:{};
}

/* ---- 固定・くり返しの作り方 ---- */
function prevYmOf(ym){const p=ym.split('-').map(Number);const d=new Date(p[0],p[1]-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
/* 固定：人ごとの「曜日ごとの決まった勤務」を、その月の開園日に当てはめる */
function basePattern(S,info){
  const cells={};const SHL=shIds(S);
  S.staff.forEach(s=>{const w=wishOf(S,s.id);const pat=s.pat||{};const c={};
    info.days.forEach(day=>{if(!day.open||offWish(w[day.d])) return;const t=pat[day.dow];if(t&&SHL.indexOf(t)>=0) c[day.d]=t;});
    cells[s.id]=c;});
  return cells;
}
/* くり返し：前の月の第1月曜→今月の第1月曜…のように、曜日をそろえて写す。日ごとに選んだ勤務時間（hb）も写す */
function baseRepeat(S,info,hbOut){
  const pym=prevYmOf(S.ym);const ps=S.schedules[pym];if(!ps) return null;const SHL=shIds(S);
  const pinfo=monthInfo(Object.assign({},S,{ym:pym}));
  const byDow={};pinfo.days.forEach(day=>{if(day.open)(byDow[day.dow]=byDow[day.dow]||[]).push(day.d);});
  const pw=S.wishes[pym]||{};const phb=ps.hb||{};
  /* 前の月に希望休・有給で休んだ日は、その曜日にいちばん多かった勤務で埋める */
  const usual=(sid,dow)=>{const cnt={};(byDow[dow]||[]).forEach(d=>{if(offWish((pw[sid]||{})[d])) return;const t=(ps.cells[sid]||{})[d]||'';cnt[t]=(cnt[t]||0)+1;});let best='',bc=-1;Object.keys(cnt).forEach(t=>{if(cnt[t]>bc){bc=cnt[t];best=t;}});return best;};
  const occ={};const cells={};S.staff.forEach(s=>{cells[s.id]={};});
  info.days.forEach(day=>{
    const k=occ[day.dow]=(occ[day.dow]||0)+1;
    if(!day.open) return;const list=byDow[day.dow]||[];if(!list.length) return;
    const src=list[Math.min(k,list.length)-1];
    S.staff.forEach(s=>{
      if(offWish(wishOf(S,s.id)[day.d])) return;
      let t=(ps.cells[s.id]||{})[src]||'';
      if(!t&&offWish((pw[s.id]||{})[src])) t=usual(s.id,day.dow);
      if(t&&SHL.indexOf(t)<0) t='';
      if(t){cells[s.id][day.d]=t;const b=phb[s.id]&&phb[s.id][src];if(hbOut&&b!=null)(hbOut[s.id]=hbOut[s.id]||{})[day.d]=b;}
    });
  });
  return cells;
}
/* 足りない勤務に交代を入れる：①その日の出勤者の勤務を入れかえ ②休みの人から代わりを選ぶ。印 1=代わりに出勤 2=勤務の入れかえ */
function fillSubs(S,info,cells,hb){
  const R=S.rules;const maxC=Math.max(1,Number(R.maxConsec)||5);const n=info.n;const subs={},used={},work={};
  const SHL=shIds(S);const LE=leSets(S);const mids=midIds(S,LE);const ord=mids.concat(SHL.filter(t=>mids.indexOf(t)<0));
  S.staff.forEach(s=>{cells[s.id]=cells[s.id]||{};subs[s.id]={};used[s.id]=0;work[s.id]=Object.keys(cells[s.id]).length;});
  const runAt=(sid,d)=>{const c=cells[sid];let r=1;for(let x=d-1;x>=1&&c[x];x--) r++;for(let x=d+1;x<=n&&c[x];x++) r++;return r;};
  const leOK=(sid,d,t)=>{if(!R.noLateEarly||!LE) return true;const c=cells[sid];return !((LE.early[t]&&LE.late[c[d-1]])||(LE.late[t]&&LE.early[c[d+1]]));};
  info.days.forEach(day=>{
    if(!day.open) return;const d=day.d;
    const cnt=()=>{const o={};SHL.forEach(t=>{o[t]=0;});S.staff.forEach(s=>{const t=cells[s.id][d];if(t&&o[t]!=null) o[t]++;});return o;};
    const qShort=(d,day)=>qualReqs(S,day).filter(q=>qCount(S,cells,d,q.id,q.half,hb)<q.need).map(q=>q.id);
    SHL.forEach(t=>{
      const need=reqOf(S,day,t);let c=cnt();
      while(c[t]<need){
        let best=null,bc=Infinity;
        S.staff.forEach(s=>{const u=cells[s.id][d];if(!u||u===t||c[u]<=reqOf(S,day,u)||!s.can[t]||!leOK(s.id,d,t)) return;const cost=used[s.id]+Math.random()*0.3;if(cost<bc){bc=cost;best=s;}});
        if(!best) break;cells[best.id][d]=t;subs[best.id][d]=2;used[best.id]++;c=cnt();
      }
      while(c[t]<need){
        let best=null,bc=Infinity;
        const qs=qShort(d,day);
        S.staff.forEach(s=>{if(cells[s.id][d]||offWish(wishOf(S,s.id)[d])||!s.can[t]||s.dows.indexOf(day.dow)<0) return;if(runAt(s.id,d)>maxC||!leOK(s.id,d,t)) return;const cost=used[s.id]*10+work[s.id]+Math.random()*0.5-qs.filter(id=>hasQ(s,id)).length*40;if(cost<bc){bc=cost;best=s;}});
        if(!best) break;cells[best.id][d]=t;subs[best.id][d]=1;used[best.id]++;work[best.id]++;c=cnt();
      }
    });
    /* 資格の人数がまだ足りないときは、その資格を持つ休みの人に入ってもらう */
    qualReqs(S,day).forEach(q=>{
      let have=qCount(S,cells,d,q.id,q.half,hb);
      while(have<q.need){
        let best=null,bt='',bc=Infinity;
        S.staff.forEach(s=>{if(!hasQ(s,q.id)||cells[s.id][d]||offWish(wishOf(S,s.id)[d])||s.dows.indexOf(day.dow)<0||runAt(s.id,d)>maxC) return;
          const t=ord.find(x=>s.can[x]&&leOK(s.id,d,x)&&coversHalf(S,s,x,q.half,d,hb));if(!t) return;const cost=used[s.id]*10+work[s.id]+Math.random()*0.5;if(cost<bc){bc=cost;best=s;bt=t;}});
        if(!best) break;cells[best.id][d]=bt;subs[best.id][d]=1;used[best.id]++;work[best.id]++;have++;
      }
    });
  });
  return subs;
}
function genBy(S){
  const mode=S.genMode||'auto';
  if(mode==='auto') return {cells:generate(S),subs:{},hb:{}};
  const info=monthInfo(S);const hb={};const cells=mode==='fixed'?basePattern(S,info):baseRepeat(S,info,hb);
  if(!cells) return null;
  return {cells:cells,subs:S.fillSubs===false?{}:fillSubs(S,info,cells,hb),hb:hb};
}

/* いまの勤務表が条件に合っているかを確かめる（手で直したあとも同じ基準で見る） */
function check(S){
  const info=monthInfo(S);const sc=S.schedules[S.ym];const cells=sc?sc.cells:{};
  const R=S.rules;const maxC=Math.max(1,Number(R.maxConsec)||5);const auto=(S.genMode||'auto')==='auto';
  const SHL=shIds(S),ALL=shAll(S);const LE=leSets(S);const hb=sc&&sc.hb;
  const zero=()=>{const o={};ALL.forEach(t=>{o[t]=0;});return o;};
  const dayCnt={};info.days.forEach(day=>{dayCnt[day.d]=zero();});
  const per={};const issues=[];
  const dl=d=>info.m+'/'+d+'('+DOW[info.days[d-1].dow]+')';
  S.staff.forEach(s=>{
    const c=cells[s.id]||{};const w=wishOf(S,s.id);const nm=(s.name||'名前なし')+'さん';
    const p=Object.assign(zero(),{work:0});let run=0,start=0;
    const closeRun=end=>{if(auto&&run>maxC) issues.push(nm+'：'+dl(start)+'〜'+dl(end)+' が'+run+'日つづきの勤務です（上限'+maxC+'日）');run=0;};
    info.days.forEach(day=>{
      const t=c[day.d];
      if(!t){closeRun(day.d-1);return;}
      p[t]=(p[t]||0)+1;p.work++;dayCnt[day.d][t]=(dayCnt[day.d][t]||0)+1;
      if(run===0) start=day.d;
      run++;
      if(!day.open) issues.push(nm+'：'+dl(day.d)+' は休園日ですが、勤務が入っています');
      else if(offWish(w[day.d])) issues.push(nm+'：'+dl(day.d)+' は'+(w[day.d]==='P'?'有給':'希望休')+'ですが、勤務が入っています');
      else if(auto&&s.dows.indexOf(day.dow)<0) issues.push(nm+'：'+DOW[day.dow]+'曜は勤務できない設定ですが、'+dl(day.d)+' に勤務が入っています');
      if(auto&&!s.can[t]) issues.push(nm+'：'+dl(day.d)+' の'+shName(S,t)+'は、できない勤務に設定されています');
      if(auto&&R.noLateEarly&&LE&&LE.early[t]&&LE.late[c[day.d-1]]) issues.push(nm+'：'+dl(day.d-1)+' '+shName(S,c[day.d-1])+'の次の日が'+shName(S,t)+'になっています');
    });
    closeRun(info.n);
    const tg=targetOf(S,s,info);
    if(auto&&p.work<tg) issues.push(nm+'：勤務が予定より'+(tg-p.work)+'日少なくなっています（予定'+tg+'日）');
    if(auto&&p.work>tg) issues.push(nm+'：勤務が予定より'+(p.work-tg)+'日多くなっています（予定'+tg+'日）');
    per[s.id]=p;
  });
  const shorts=[];
  info.days.forEach(day=>{
    if(!day.open) return;const parts=[];
    SHL.forEach(t=>{const need=reqOf(S,day,t);if(dayCnt[day.d][t]<need) parts.push(shName(S,t)+'があと'+(need-dayCnt[day.d][t])+'人');});
    qualReqs(S,day).forEach(q=>{const have=qCount(S,cells,day.d,q.id,q.half,hb);if(have<q.need) parts.push(HALFN[q.half]+'の'+q.name+'があと'+(q.need-have)+'人');});
    if(parts.length) shorts.push(dl(day.d)+'：'+parts.join('、')+' 足りません');
  });
  return {info:info,dayCnt:dayCnt,per:per,issues:shorts.concat(issues),shortDays:shorts.length};
}

/* ---------- 勤務の種類（画面用） ----------
   SH＝いま使っている勤務、SHN・SHS＝名前と表の文字（消した勤務も、前の月の表のために入れておく）。描くたびに S から作り直す */
let SH=['E','N','L'],SHN={E:'早番',N:'通常',L:'遅番'},SHS={E:'早',N:'通',L:'遅'};
function syncSH(){SH=shIds(S);SHN={};SHS={};shAll(S).forEach(t=>{SHN[t]=shName(S,t);SHS[t]=S.shifts[t].ab||SHN[t].slice(0,1);});}
function shCls(t){const x=S.shifts[t];return 'k'+(((x&&x.col)||0)%SH_COLS);}
/* その月の表に出す勤務：使っている勤務と、その月の表に入っている勤務（消した勤務でも） */
function monthSh(sc,tbl){const used={};if(sc) Object.keys(sc.cells||{}).forEach(id=>{const c=sc.cells[id];Object.keys(c).forEach(d=>{used[c[d]]=1;});});
  return shAll(S).filter(t=>{const x=S.shifts[t];return used[t]||(!x.del&&(!tbl||(Number(x.wk)||0)>0||(Number(x.we)||0)>0));});}
/* 表の文字（1〜2文字）。自分で決めていないときは、名前から、ほかの勤務と重ならない文字を選ぶ */
function abFrom(name,used){
  const ch=Array.from(String(name||'').replace(/[\s　]/g,''));if(!ch.length) return '?';
  const c=[ch[0]];const last=ch[ch.length-1];
  if(ch.length>1&&last!=='番'&&last!==ch[0]) c.push(ch[0]+last);
  if(ch.length>1) c.push(ch[0]+ch[1]);
  ch.slice(1).forEach(x=>{if(x!=='番') c.push(x);});
  for(let i=0;i<c.length;i++){if(!used[c[i]]) return c[i];}
  return ch.slice(0,2).join('');
}
function syncAbs(st){
  const ids=shAll(st);const used={};
  ids.forEach(t=>{const x=st.shifts[t];if(!x.abAuto&&x.ab) used[x.ab]=1;});
  ids.forEach(t=>{const x=st.shifts[t];if(x.abAuto||!x.ab){x.ab=abFrom(x.name,used);x.abAuto=true;}used[x.ab]=1;});
}
function freeCol(st){const u={};shIds(st).forEach(t=>{u[st.shifts[t].col]=1;});for(let i=0;i<SH_COLS;i++){if(!u[i]) return i;}return shIds(st).length%SH_COLS;}
function normShifts(s){
  if(!Array.isArray(s.shiftIds)) s.shiftIds=['E','N','L'].filter(k=>s.shifts[k]);
  s.shiftIds=s.shiftIds.filter((k,i,a)=>s.shifts[k]&&typeof s.shifts[k]==='object'&&a.indexOf(k)===i);
  if(!s.shiftIds.some(k=>!s.shifts[k].del)){s.shifts.N=Object.assign({start:'08:30',end:'17:30',wk:0,we:0},s.shifts.N||{},{del:false});if(s.shiftIds.indexOf('N')<0) s.shiftIds.push('N');}
  s.shiftIds.forEach(k=>{const x=s.shifts[k];const d=SH_DEF[k];
    if(!x.name) x.name=d?d.name:'勤務';
    if(x.start==null) x.start='09:00';if(x.end==null) x.end='17:00';if(x.wk==null) x.wk=0;if(x.we==null) x.we=0;});
  s.shiftIds.forEach(k=>{const x=s.shifts[k];if(x.col==null){const d=SH_DEF[k];const taken=s.shiftIds.some(j=>j!==k&&s.shifts[j].col===(d&&d.col));x.col=d&&!taken?d.col:freeCol(s);}});
  syncAbs(s);
}

function calGrid(info,cellFn,cls){

}

/* 時間2〜5で働く日がある職員がいるか（凡例に印の説明を出す） */
function hasBands(){const sc=S.schedules[S.ym];if(!sc) return false;return S.staff.some(s=>{if(!ownHrs(s)||!(s.hrs.alt||[]).length) return false;const c=sc.cells[s.id]||{};return Object.keys(c).some(d=>bandOf(S,s,Number(d),sc.hb)>0);});}
function hasSubs(){const sc=S.schedules[S.ym];return !!(sc&&sc.subs&&Object.keys(sc.subs).some(k=>Object.keys(sc.subs[k]).length));
}

    +'<button type="button" class="iconbtn sh-del" data-act="shdelask" data-v="'+t+'" aria-label="'+nm+'を消す"'+(one?' disabled title="勤務の種類は1つ以上いります"':'')+'>×</button></div>'

/* ---------- これまでのアプリから取りこむ（合わせたアプリだけ） ----------
   同じ端末・同じブラウザなら、ほほえみ勤務表（hohoemi-kinmuhyo-v1）と、ほほえみタイムカード（hohoemi-timecard-v1）の

const OLD_KEYS={roster:'hohoemi-kinmuhyo-v1',tc:'hohoemi-timecard-v1'};
function parseOld(text){try{const o=JSON.parse(text);if(!o||typeof o!=='object') return null;if(!o.punches) o.punches={};if(!o.reqs) o.reqs=[];if(!o.paid) o.paid={};return normalize(o);}catch(e){return null;}}
function readOld(kind){if(APP!=='both') return null;let t=null;try{t=localStorage.getItem(OLD_KEYS[kind]);}catch(e){}return t?parseOld(t):null;}
const nameKey=n=>String(n||'').replace(/[\s　]/g,'');
function mergeOld(R,T){
  const base=JSON.parse(JSON.stringify(R||T));const rep={same:0,added:0,staff:0,pin:''};
  if(R&&T){
    const map={},used={};
    T.staff.forEach(ts=>{
      const m=base.staff.find(bs=>!used[bs.id]&&nameKey(bs.name)&&nameKey(bs.name)===nameKey(ts.name));
      if(m){used[m.id]=1;map[ts.id]=m.id;if(ts.brk!=null) m.brk=ts.brk;rep.same++;}
      else{let id=ts.id;if(base.staff.some(x=>x.id===id)) id=uid();base.staff.push({id:id,name:ts.name,brk:ts.brk!=null?ts.brk:null});map[ts.id]=id;rep.added++;}
    });
    const mid=id=>map[id]||id;
    const remap=src=>{const out={};Object.keys(src||{}).forEach(k=>{const d=src[k],nd={};Object.keys(d).forEach(id=>{nd[mid(id)]=d[id];});out[k]=nd;});return out;};
    base.punches=remap(T.punches);base.paid=remap(T.paid);
    base.reqs=(T.reqs||[]).map(q=>Object.assign({},q,{sid:mid(q.sid)}));
    base.tc=Object.assign({},T.tc);base.tcSnap={};
    if(!(base.facility.name||'').trim()&&T.facility&&T.facility.name) base.facility.name=T.facility.name;
    if(!base.pin&&T.pin){base.pin=T.pin;base.rc=T.rc||'';base.rcAt=T.rcAt||0;rep.pin='tc';}
    else if(base.pin&&T.pin&&base.pin!==T.pin) rep.pin='roster';
  }
  if(!R){base.schedules={};base.wishes={};}
  if(!T){base.punches={};base.reqs=[];base.paid={};base.tcSnap={};}
  base.sample=false;base.mode='admin';base.view='joken';base.punchAt=Date.now();base.pinReq=null;
  const st=normalize(base);rep.staff=st?st.staff.length:0;
  return {state:st,rep:rep};
}

const wishClosed=()=>!!(S.wishClosed&&S.wishClosed[S.ym]);
function wishCal(s,locked){
  const info=INFO();const w=wishOf(S,s.id);
  return calGrid(info,day=>{
    const ok=day.open&&s.dows.indexOf(day.dow)>=0;const st=w[day.d]||'';
    const lab=!day.open?'休園':!ok?'勤務なし':st==='W'?'希望休':st==='P'?'有給':st==='H'?'有給(半日)':'';
    return '<button type="button" class="wday'+(st?' st-'+st:'')+(ok&&locked?' is-locked':'')+'" data-act="wish" data-v="'+day.d+'" data-s="'+s.id+'"'+(ok&&!locked?'':' disabled')+' aria-label="'+day.d+'日（'+DOW[day.dow]+'）'+(lab||'希望なし')+'"><b>'+day.d+'</b><small>'+(lab||'&nbsp;')+'</small></button>';
  });
}
function wishCounts(s){
  const w=wishOf(S,s.id);const lim=Number(S.rules.wishLimit)||0;const cnt=k=>Object.keys(w).filter(d=>w[d]===k).length;
  return '<span class="pill pW">希望休 '+cnt('W')+(lim?' / '+lim:'')+'日</span><span class="pill pP">有給 '+(Math.round(paidDays(w)*10)/10)+'日</span>';
}

    +'<button type="button" class="cm-opt cm-off" data-act="cellset" data-v="" aria-pressed="'+(!cur)+'"><b>'+icon('O')+'休み</b><small>勤務を入れない</small></button></div>';

/* ④ 全体の勤務表 */
function rosterTable(inter,meId){
  const ck=check(S);const info=ck.info;const sc=S.schedules[S.ym];const MS=monthSh(sc,true);const hb=sc.hb||{};const ncol=MS.length+2;
  const dcl=day=>(day.open?'':' closed')+(day.holiday||day.dow===0?' sunc':day.dow===6?' satc':'');
  let h='<table class="roster"><thead><tr><th scope="col" class="namecol">なまえ</th>';
  info.days.forEach(day=>{h+='<th scope="col" class="dcol'+dcl(day)+'"'+(day.holiday?' title="'+esc(day.holiday)+'"':'')+'><span class="dn">'+day.d+'</span><span class="dwk">'+DOW[day.dow]+'</span></th>';});
  h+=MS.map(t=>'<th scope="col" class="tot" title="'+esc(SHN[t])+'">'+esc(SHS[t])+'</th>').join('')+'<th scope="col" class="tot">勤務</th><th scope="col" class="tot">休み</th></tr></thead><tbody>';
  S.staff.forEach(s=>{
    const c=sc.cells[s.id]||{};const w=wishOf(S,s.id);const p=ck.per[s.id];const sb=(sc.subs&&sc.subs[s.id])||{};
    h+='<tr'+(meId===s.id?' class="me"':'')+'><th scope="row" class="namecol">'+esc(s.name||'名前なし')+'<small>'+(ownHrs(s)?fmtT(s.hrs.start)+'〜'+fmtT(s.hrs.end)+((s.hrs.alt||[]).length?'ほか':'')+' ':'')+(s.type==='part'?'パート':'常勤')+((s.quals||[]).length?'・'+(s.quals||[]).map(id=>{const q=qById(id);return q?esc(qLabel(q)):'';}).filter(Boolean).join('・'):'')+'</small></th>';
    info.days.forEach(day=>{
      const t=c[day.d];let cls,txt,lab;
      let hk=0;
      if(t){hk=(s.hrs&&(s.hrs.alt||[]).length)?bandOf(S,s,day.d,hb):0;cls=shCls(t)+(sb[day.d]?' sub':'')+(w[day.d]==='H'?' hp':'')+(hk>0?' hb':'');txt=esc(SHS[t]);lab=esc(SHN[t])+(hk>0?'（時間'+(hk+1)+'）':'')+(sb[day.d]?'（交代）':'')+(w[day.d]==='H'?'（半日有給）':'');}
      else if(!day.open){h+='<td class="closed"></td>';return;}
      else if(w[day.d]==='W'){cls='cW';txt='希';lab='希望休';}
      else if(w[day.d]==='P'){cls='cP';txt='有';lab='有給';}
      else if(w[day.d]==='H'){cls='cP';txt='半';lab='有給（半日）';}
      else{cls='cOff';txt='・';lab='休み';}
      const hbA=hk>0?' data-hb="'+(hk+1)+'"':'';
      h+=inter?'<td><button type="button" class="cellbtn '+cls+'"'+hbA+' data-act="cell" data-s="'+s.id+'" data-d="'+day.d+'" aria-label="'+esc(s.name)+' '+day.d+'日 '+lab+'" aria-haspopup="dialog">'+txt+'</button></td>'
        :'<td><span class="cellbtn '+cls+'"'+hbA+' title="'+lab+'">'+txt+'</span></td>';
    });
    h+=MS.map(t=>'<td class="tot">'+(p[t]||0)+'</td>').join('')+'<td class="tot strong">'+p.work+'</td><td class="tot">'+(info.n-p.work)+'</td></tr>';
  });
  h+='</tbody><tfoot>';
  MS.forEach(t=>{
    h+='<tr><th scope="row" class="namecol">'+esc(SHN[t])+'の人数</th>';
    info.days.forEach(day=>{
      const have=ck.dayCnt[day.d][t]||0,need=S.shifts[t].del?0:reqOf(S,day,t);
      if(!day.open&&!have){h+='<td class="closed"></td>';return;}
      h+=have<need?'<td class="short" title="あと'+(need-have)+'人">'+have+'/'+need+'</td>':'<td>'+have+'</td>';
    });
    h+='<td class="tot" colspan="'+ncol+'"></td></tr>';
  });
  [{id:null,label:'全員'}].concat(qShown().map(q=>({id:q.id,label:qLabel(q),q:q}))).forEach(row=>{
    h+='<tr><th scope="row" class="namecol">'+esc(row.label)+'の人数<small class="ampmh">上：午前／下：午後</small></th>';
    info.days.forEach(day=>{
      const am=qCount(S,sc.cells,day.d,row.id,'am',hb),pm=qCount(S,sc.cells,day.d,row.id,'pm',hb);
      if(!day.open&&!am&&!pm){h+='<td class="closed"></td>';return;}
      const na=row.q?qNeed(row.q,day,'am'):0,np=row.q?qNeed(row.q,day,'pm'):0;
      h+='<td class="ampm"'+(am<na||pm<np?' title="'+(am<na?'午前あと'+(na-am)+'人 ':'')+(pm<np?'午後あと'+(np-pm)+'人':'')+'"':'')+'><span'+(am<na?' class="ng"':'')+'>'+am+'</span><span'+(pm<np?' class="ng"':'')+'>'+pm+'</span></td>';
    });
    h+='<td class="tot" colspan="'+ncol+'"></td></tr>';
  });
  return h+'</tfoot></table>';
}

/* 全体の勤務表をカレンダーの形で。名前は名字だけ（同じ名字がいるときはフルネーム） */
function shortNames(){
  const first=s=>((s.name||'').trim().split(/[\s　]+/)[0])||'名前なし';
  const cnt={};S.staff.forEach(s=>{const f=first(s);cnt[f]=(cnt[f]||0)+1;});
  const map={};S.staff.forEach(s=>{const f=first(s);map[s.id]=cnt[f]>1?((s.name||'').replace(/[\s　]+/g,'')||f):f;});
  return map;
}
function dayCounts(day,sc){
  const ab=qAbbrMap();const qs=qShown();
  const line=h=>qs.map(q=>{const n=qCount(S,sc.cells,day.d,q.id,h,sc.hb);const need=qNeed(q,day,h);return n||need?'<span'+(n<need?' class="ng"':'')+'>'+esc(ab[q.id])+n+'</span>':'';}).filter(Boolean).join(' ')+' <span>計'+qCount(S,sc.cells,day.d,null,h,sc.hb)+'</span>';
  const a=line('am'),p=line('pm');
  return a===p?'<div class="ocount"><span class="oh">午前・午後</span>'+a+'</div>':'<div class="ocount"><span class="oh">午前</span>'+a+'</div><div class="ocount"><span class="oh">午後</span>'+p+'</div>';
}
function qAbbrNote(){const ab=qAbbrMap();const qs=qShown();return '<p class="qabbr">人数の見かた：'+qs.map(q=>esc(ab[q.id])+'＝'+esc(q.name)).join('　')+'　計＝その時間にいる全員（1人がいくつかの資格を持つときは、それぞれに数えます）</p>';}
function overallCal(){
  const info=INFO();const sc=S.schedules[S.ym];const nm=shortNames();const MS=monthSh(sc);
  return calGrid(info,day=>{
    const dc=(day.holiday||day.dow===0)?'sunc':day.dow===6?'satc':'';
    const by={};MS.forEach(t=>{by[t]=[];});let any=false;
    S.staff.forEach(s=>{const t=(sc.cells[s.id]||{})[day.d];if(t&&by[t]){any=true;const sub=sc.subs&&sc.subs[s.id]&&sc.subs[s.id][day.d];const hp=wishOf(S,s.id)[day.d]==='H'?'<small class="ohp">(半有)</small>':'';by[t].push((sub?'<span class="onsub">'+esc(nm[s.id])+'</span>':esc(nm[s.id]))+hp);}});
    let h='<div class="oday'+(day.open?'':' closed')+'"><div class="oday-top"><b class="'+dc+'">'+day.d+'</b>'+(day.holiday?'<small>'+esc(day.holiday)+'</small>':'')+'</div>';
    if(!day.open&&!any) return h+'<span class="oclosed">休園</span></div>';
    const need=t=>S.shifts[t].del?0:reqOf(S,day,t);
    MS.forEach(t=>{
      if(by[t].length||need(t)) h+='<div class="oline"><span class="otag '+shCls(t)+'" title="'+esc(SHN[t])+'">'+esc(SHS[t])+'</span><span class="onames">'+(by[t].length?by[t].join('・'):'―')+'</span></div>';
    });
    const short=MS.filter(t=>by[t].length<need(t)).map(t=>esc(SHN[t])+'あと'+(need(t)-by[t].length)+'人');
    qualReqs(S,day).forEach(q=>{const have=qCount(S,sc.cells,day.d,q.id,q.half,sc.hb);if(have<q.need) short.push(HALFN[q.half]+esc(qLabel(qById(q.id)||q))+'あと'+(q.need-have)+'人');});
    h+=dayCounts(day,sc);
    if(short.length) h+='<span class="oshort">'+short.join('・')+'</span>';
    return h+'</div>';
  },'ocal');
}

/* ---------- タイムカード ---------- */
function keyOf(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function todayKey(){const d=new Date();return keyOf(d.getFullYear(),d.getMonth()+1,d.getDate());}
function prevKey(k){const p=k.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]-1);return keyOf(d.getFullYear(),d.getMonth()+1,d.getDate());}
function curYm(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function toMin(t){if(!t) return null;const p=String(t).split(':');const h=parseInt(p[0],10),m=parseInt(p[1],10);return isNaN(h)||isNaN(m)?null:h*60+m;}
function fmtClock(m){if(m==null) return '—';const mm=((m%1440)+1440)%1440;return (m>=1440?'翌':'')+Math.floor(mm/60)+':'+pad(mm%60);}
function fmtDur(min){const h=Math.floor(min/60),m=min%60;return h+'時間'+(m?m+'分':'');}
function fmtHM(min){return Math.floor(min/60)+':'+pad(min%60);}
function timeVal(m){if(m==null) return '';const mm=((m%1440)+1440)%1440;return pad(Math.floor(mm/60))+':'+pad(mm%60);}
/* 休憩：その日にえらんだ休憩（r.b）があればそれを差し引く。なければ、決めた時間をこえた日に「ふだんの休憩」を差し引く。
   ふだんの休憩は、人ごとに決めてあればその時間（s.brk）、なければ事業所の基本（S.tc.breakMin） */
const BRK_OPTS=[0,30,45,60,90,120];
function fmtBrk(m){m=Number(m)||0;if(!m) return 'なし';const h=Math.floor(m/60),mm=m%60;return h?(h+'時間'+(mm?mm+'分':'')):mm+'分';}
function usualBrk(sid){const s=staffById(sid);return s&&s.brk!=null&&s.brk!==''?Number(s.brk):(Number(S.tc.breakMin)||0);}
function autoBrk(g,sid){return g>(Number(S.tc.breakAfterH)||0)*60?usualBrk(sid):0;}
/* 1日の勤務時間＝退勤−出勤−休憩。1分単位で、切り捨てはしない */
function recMin(r,sid){
  if(!r||r.i==null||r.o==null) return null;const g=r.o-r.i;if(g<=0) return null;
  const brk=r.b!=null?Number(r.b):autoBrk(g,sid);
  return {gross:g,brk:brk,net:Math.max(0,g-brk),auto:r.b==null};
}
/* 有給：タイムカードで入れた有給は S.paid['2026-10-05'][職員のid] = 1（1日）または 0.5（半日）。
   合わせたアプリでは、勤務表の希望休で入れた有給（P＝1日、H＝半日）も使う。
   勤務表の有給は、管理者の「個人の記録」には入れた時点で出し、合計や集計の一覧表・職員の記録には、その月の勤務表を職員に公開してから入れる */
function rosterPaid(k,sid){if(!HAS_ROSTER) return 0;const v=(((S.wishes[k.slice(0,7)]||{})[sid])||{})[Number(k.slice(8))];return v==='P'?1:v==='H'?0.5:0;}
function rosterPub(k){const sc=S.schedules[k.slice(0,7)];return !!(sc&&sc.published);}
function tcPaidOf(k,sid){const d=S.paid&&S.paid[k];return d&&d[sid]?Number(d[sid]):0;}
function paidOf(k,sid){const rv=rosterPaid(k,sid);if(rv&&rosterPub(k)) return rv;return tcPaidOf(k,sid);}
function fmtPaid(n){return n===0.5?'半日':(Math.round(n*10)/10)+'日';}
function paidDates(pd,m){return pd.map(z=>m+'/'+z.d+(z.v===0.5?'(半日)':'')).join('・');}
function isOpenToday(k,r){return k===todayKey()&&r&&r.i!=null&&r.o==null;}
function tcPerson(sid,ym){
  const p=ym.split('-').map(Number);const n=new Date(p[0],p[1],0).getDate();let days=0,min=0,miss=0,paid=0;const rows=[],pd=[];
  for(let d=1;d<=n;d++){
    const k=keyOf(p[0],p[1],d);const r=(S.punches[k]||{})[sid];const c=recMin(r,sid);const pv=paidOf(k,sid);const rp=rosterPaid(k,sid);
    if(r){if(c){days++;min+=c.net;}else if(!isOpenToday(k,r)) miss++;}
    if(pv){paid+=pv;pd.push({d:d,v:pv});}
    rows.push({d:d,k:k,r:r,c:c,p:pv,rp:rp,rpub:rp?rosterPub(k):false,dow:new Date(p[0],p[1]-1,d).getDay()});
  }
  return {rows:rows,days:days,min:min,miss:miss,paid:paid,pd:pd};
}
function workingNow(sid){const k=todayKey();const r=(S.punches[k]||{})[sid];return !!(r&&r.i!=null&&r.o==null);}
function overnightOpen(sid){
  const k=todayKey();if((S.punches[k]||{})[sid]) return null;
  const pr=(S.punches[prevKey(k)]||{})[sid];
  return pr&&pr.i!=null&&pr.o==null&&(nowMin()+1440-pr.i)<=16*60?pr:null;
}
function doPunch(kind){
  const me=staffById(UI.me);if(!me) return;
  const k=todayKey(),now=nowMin();const day=S.punches[k]||(S.punches[k]={});const r=day[me.id];let t=now,note='',rk=k;
  if(kind==='in'){
    if(r&&r.i!=null){toast('きょうは '+fmtClock(r.i)+' に出勤ずみです');return;}
    if(r) r.i=now;else day[me.id]={i:now,o:null};
  }else{
    const pr=overnightOpen(me.id);
    if(r&&r.o!=null){toast('きょうは '+fmtClock(r.o)+' に退勤ずみです');return;}
    if(r) r.o=now;
    else if(pr){pr.o=now+1440;rk=prevKey(k);}
    else{day[me.id]={i:null,o:now};note='出勤の記録がありません。管理者に出勤の時刻を直してもらってください。';}
  }
  S.punchAt=Date.now();save();
  UI.punched={kind:kind,t:t,name:me.name,note:note,rk:rk,sid:me.id};renderMain();
  punchTimer(note?12000:kind==='out'?15000:6000);
}
/* 打刻のあとの画面は、しばらくすると名前の選択にもどる（さわると少しのばす） */
function punchTimer(ms){const token=Date.now()+Math.random();if(UI.punched) UI.punched.token=token;

function brkPick(v){

const REASONS=['出勤を押し忘れ','退勤を押し忘れ','押しまちがい','休憩の時間がちがう','その他'];
function rqText(q){return '出勤 <b>'+(q.i!=null?fmtClock(q.i):'そのまま')+'</b>・退勤 <b>'+(q.o!=null?fmtClock(q.o):'そのまま')+'</b>'+(q.b!=null?'・休憩 <b>'+fmtBrk(q.b)+'</b>':'');}
function dayLabel(k){const p=k.split('-').map(Number);return p[1]+'/'+p[2]+'('+DOW[new Date(p[0],p[1]-1,p[2]).getDay()]+')';}
function pendingReqs(){return (S.reqs||[]).filter(q=>q.st==='wait');}
function tcBadge(){const n=HAS_TC?pendingReqs().length:0;return n?'<span class="stbadge" aria-label="修正の申請 '+n+'件">'+n+'</span>':'';}

function rqForm(me){

function rqSubmit(){
  const me=staffById(UI.me);if(!me||!UI.rq) return;
  const day=$('#rq-day').value,iv=$('#rq-i').value,ov=$('#rq-o').value,note=$('#rq-note').value.trim(),bs=$('#rq-b')?$('#rq-b').value:'';
  Object.assign(UI.rq,{day:day,iv:iv,ov:ov,bv:bs,note:note,err:''});const b=bs===''?null:Number(bs);
  const i=toMin(iv),o=toMin(ov);const r=(S.punches[day]||{})[me.id];
  const fi=i!=null?i:(r?r.i:null),fo=o!=null?o:(r?r.o:null);
  let err='';
  if(i==null&&o==null&&b==null) err='出勤・退勤の時刻か、休憩をえらんでください';
  else if(b!=null&&(fi==null||fo==null)) err='休憩を直すときは、出勤と退勤の時刻もそろえてください';
  else if(fi!=null&&fo!=null&&fo<1440&&fo<=fi) err='退勤は、出勤より後の時刻にしてください';
  else if(day===todayKey()&&((i!=null&&i>nowMin())||(o!=null&&o>nowMin()))) err='まだ来ていない時刻は申請できません';
  else if(!UI.rq.reason) err='理由をえらんでください';
  if(err){UI.rq.err=err;renderMain();const f=$('#rq-sec');if(f) f.scrollIntoView({block:'nearest'});return;}
  S.reqs.push({id:uid(),sid:me.id,day:day,i:i,o:o,b:b,reason:UI.rq.reason,note:note,at:Date.now(),st:'wait'});
  save();UI.rq=null;renderMain();toast('申請しました。管理者が承認すると記録が直ります');
}
function reqAdminSection(){

/* 見本用：今月のきのうまでの打刻（きょうは時刻に合わせて） */
function samplePunches(st){
  const P={};const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1,today=now.getDate();const hol=holidaysOf(y);const nm=now.getHours()*60+now.getMinutes();
  for(let d=1;d<=today;d++){
    const dow=new Date(y,m-1,d).getDay();if(st.openDows.indexOf(dow)<0||(hol[m+'-'+d]&&st.closeHolidays)) continue;
    const day={};
    st.staff.forEach((s,i)=>{
      if(s.dows.indexOf(dow)<0) return;
      if(Math.random()>(s.type==='part'?0.55:(dow===6?0.4:0.86))) return;
      const opts=shIds(st).filter(t=>s.can[t]);if(!opts.length) return;const t=opts[(d+i)%opts.length];
      const a=toMin(st.shifts[t].start)-Math.floor(Math.random()*12),b=toMin(st.shifts[t].end)+Math.floor(Math.random()*25);
      if(d===today){if(a>nm) return;day[s.id]={i:a,o:b<=nm?b:null};}else day[s.id]={i:a,o:b};
    });
    if(Object.keys(day).length) P[keyOf(y,m,d)]=day;
  }
  const keys=Object.keys(P).filter(k=>k!==keyOf(y,m,today));
  if(keys.length>2&&st.staff[1]){const k=keys[Math.floor(keys.length/2)];if(P[k][st.staff[1].id]) P[k][st.staff[1].id].o=null;}
  /* ふだんの休憩が決まっている人は、日によって1時間の日もある */
  st.staff.forEach(s=>{if(s.brk!=null) keys.forEach((k,j)=>{const r=P[k][s.id];if(r&&r.o!=null&&j%3===1) r.b=60;});});
  return P;
}
/* 見本用：有給の日（1日を2回、半日を1回） */
function samplePaid(st){
  const out={};const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1,today=now.getDate();
  const put=(k,id,v)=>{(out[k]=out[k]||{})[id]=v;};
  const a=st.staff[0],b=st.staff[4];const wd=[];
  for(let d=2;d<today;d++){const dow=new Date(y,m-1,d).getDay();if(dow>0&&dow<6) wd.push(d);}
  if(a) [wd[1],wd[5]].filter(Boolean).forEach(d=>{const k=keyOf(y,m,d);if(st.punches[k]){delete st.punches[k][a.id];if(!Object.keys(st.punches[k]).length) delete st.punches[k];}put(k,a.id,1);});
  if(b){const k3=Object.keys(st.punches).filter(k=>k!==keyOf(y,m,today)).find(k=>{const r=st.punches[k][b.id];return r&&r.i!=null&&r.o!=null;});
    if(k3){const r=st.punches[k3][b.id];r.o=r.i+240;delete r.b;put(k3,b.id,0.5);}}
  return out;
}
